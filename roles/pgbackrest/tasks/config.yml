---
# Package and configuration only. ./rebuild needs these on the repo host
# before PostgreSQL exists, to restore from the off-site bucket.
# From Ubuntu on Debian-family nodes, from PGDG (added by the postgres role)
# on the RHEL family.
- name: Install pgBackRest
  ansible.builtin.package:
    name: pgbackrest
    state: present
    disablerepo: "{{ '*' if dnf_offline | bool else omit }}"
    enablerepo: "{{ 'keelinfra-offline' if dnf_offline | bool else omit }}"

- name: Ensure repo directory exists (repo host)
  ansible.builtin.file:
    path: "{{ pgbackrest_repo_path }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"
  when: inventory_hostname == pgbackrest_repo_host

- name: Create pgbackrest config directory
  ansible.builtin.file:
    path: /etc/pgbackrest
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"

- name: Install the bucket's CA certificate
  ansible.builtin.copy:
    src: "{{ backup_s3.ca_file }}"
    dest: "{{ pgbackrest_s3_ca_path }}"
    owner: postgres
    group: postgres
    mode: "0644"
  when: backup_s3 | length > 0 and backup_s3.ca_file | length > 0

- name: Render pgbackrest configuration
  ansible.builtin.template:
    src: pgbackrest.conf.j2
    dest: /etc/pgbackrest/pgbackrest.conf
    owner: postgres
    group: postgres
    mode: "0640"

- name: Remove default pgbackrest conf dir marker
  ansible.builtin.file:
    path: /etc/pgbackrest.conf
    state: absent
