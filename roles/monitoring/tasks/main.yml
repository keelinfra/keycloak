---
# Exporters on every node; Prometheus, Alertmanager and Grafana on the
# monitoring host. Debian packages on Ubuntu; upstream release binaries
# under the same unit names on the RHEL family, which packages none of them.
- name: Install monitoring software
  ansible.builtin.include_tasks: "install-{{ ansible_os_family }}.yml"

# --- every node: exporters ---------------------------------------------
# The exporters and Prometheus run as prometheus and read the node's
# internal key (root:ssl-cert, 0640).
- name: Let prometheus read the internal TLS key
  ansible.builtin.user:
    name: prometheus
    groups: [ssl-cert]
    append: true
  when: internal_tls | default(false) | bool
  register: prom_group

- name: Configure exporter TLS
  ansible.builtin.copy:
    content: |
      # Managed by keelinfra
      tls_server_config:
        cert_file: {{ internal_cert_file }}
        key_file: {{ internal_key_file }}
        client_auth_type: RequireAndVerifyClientCert
        client_ca_file: {{ internal_ca_file }}
    dest: "{{ exporter_web_config }}"
    owner: root
    group: ssl-cert
    mode: "0640"
  when: internal_tls | default(false) | bool
  register: exporter_tls

# Ubuntu 24.04 packages postgres_exporter 0.15, whose stat_bgwriter collector
# reads the checkpoint columns PostgreSQL 17 moved to pg_stat_checkpointer:
# it fails on every scrape and logs an error. 0.17 reads the new view (the
# RHEL family installs that release). Nothing keelinfra alerts on or graphs
# uses these metrics, so an older exporter runs without that collector.
- name: Read the packaged postgres exporter version
  ansible.builtin.command:
    cmd: dpkg-query -W -f=${Version} prometheus-postgres-exporter
  register: pgexp_pkg
  changed_when: false
  when: ansible_os_family == 'Debian'

# Local connection over loopback, which pg_hba leaves as plain host.
- name: Configure postgres exporter connection
  vars:
    pgexp_skip_bgwriter: >-
      {{ ansible_os_family == 'Debian' and postgres_version | int >= 17
         and pgexp_pkg.stdout | regex_replace('-.*$', '') is version('0.17', '<') }}
    pgexp_args: >-
      {{ ([exporter_args] + (['--no-collector.stat_bgwriter'] if pgexp_skip_bgwriter | bool else []))
         | select | join(' ') }}
  ansible.builtin.copy:
    content: |
      # Managed by keelinfra
      DATA_SOURCE_NAME="postgresql://postgres:{{ vault_postgres_superuser_password
      }}@127.0.0.1:{{ postgres_port }}/postgres?sslmode=disable"
      ARGS="{{ pgexp_args }}"
    dest: /etc/default/prometheus-postgres-exporter
    mode: "0600"
  register: pgexp_conf

- name: Configure node exporter arguments
  ansible.builtin.lineinfile:
    path: /etc/default/prometheus-node-exporter
    regexp: '^ARGS='
    line: 'ARGS="{{ exporter_args }}"'
    create: true
    mode: "0644"
  register: nodeexp_conf

- name: Restart postgres exporter
  ansible.builtin.systemd:
    name: prometheus-postgres-exporter
    state: >-
      {{ 'restarted' if (pgexp_conf.changed or exporter_tls.changed or prom_group.changed) else 'started' }}
    enabled: true

- name: Restart node exporter
  ansible.builtin.systemd:
    name: prometheus-node-exporter
    state: >-
      {{ 'restarted' if (nodeexp_conf.changed or exporter_tls.changed or prom_group.changed) else 'started' }}
    enabled: true

# --- monitoring host: prometheus + grafana + backup metrics ------------
- name: Ensure textfile collector directory exists
  ansible.builtin.file:
    path: "{{ textfile_dir }}"
    state: directory
    mode: "0755"

- name: Install the certificate expiry metrics script
  ansible.builtin.template:
    src: cert-metrics.py.j2
    dest: /usr/local/bin/keelinfra-cert-metrics
    mode: "0755"

- name: Schedule the certificate expiry metrics
  ansible.builtin.copy:
    content: "7 * * * * root /usr/local/bin/keelinfra-cert-metrics\n"
    dest: /etc/cron.d/keelinfra-cert-metrics
    mode: "0644"

- name: Export certificate expiry once now
  ansible.builtin.command: /usr/local/bin/keelinfra-cert-metrics
  changed_when: false

- name: Configure Prometheus
  when: inventory_hostname == monitoring_host
  block:
    - name: Create rules directory
      ansible.builtin.file:
        path: /etc/prometheus/rules
        state: directory
        mode: "0755"

    - name: Render prometheus configuration
      ansible.builtin.template:
        src: prometheus.yml.j2
        dest: /etc/prometheus/prometheus.yml
        mode: "0644"
      register: prom_conf

    - name: Render alert rules
      ansible.builtin.template:
        src: alerts.yml.j2
        dest: /etc/prometheus/rules/keelinfra.yml
        mode: "0644"
      register: prom_rules

    - name: Restart prometheus
      ansible.builtin.systemd:
        name: prometheus
        state: "{{ 'restarted' if (prom_conf.changed or prom_rules.changed or prom_group.changed) else 'started' }}"
        enabled: true

    - name: Install pgbackrest metrics exporter script
      ansible.builtin.template:
        src: pgbackrest-metrics.sh.j2
        dest: /usr/local/bin/pgbackrest-metrics
        mode: "0755"

    - name: Schedule pgbackrest metrics export
      ansible.builtin.copy:
        content: "*/15 * * * * root /usr/local/bin/pgbackrest-metrics\n"
        dest: /etc/cron.d/pgbackrest-metrics
        mode: "0644"

    - name: Run metrics export once now
      ansible.builtin.command: /usr/local/bin/pgbackrest-metrics
      changed_when: false

- name: Install and configure Alertmanager (monitoring host)
  when: inventory_hostname == monitoring_host
  block:
    # One Alertmanager, no gossip peers; local only, like the drill that
    # talks to it. Operators reach it through Grafana or an ssh tunnel.
    - name: Set Alertmanager listen addresses
      ansible.builtin.copy:
        content: |
          # Managed by keelinfra
          ARGS="--web.listen-address=127.0.0.1:{{ alertmanager_port }} --cluster.listen-address="
        dest: /etc/default/prometheus-alertmanager
        mode: "0644"
      register: am_args

    - name: Render Alertmanager configuration
      ansible.builtin.template:
        src: alertmanager.yml.j2
        dest: /etc/prometheus/alertmanager.yml
        owner: prometheus
        group: prometheus
        mode: "0640"
        validate: "{{ amtool_bin }} check-config %s"
      register: am_conf

    - name: Restart Alertmanager
      ansible.builtin.systemd:
        name: prometheus-alertmanager
        state: "{{ 'restarted' if (am_args.changed or am_conf.changed) else 'started' }}"
        enabled: true

- name: Install and configure Grafana (monitoring host)
  when: inventory_hostname == monitoring_host
  block:
    - name: Set Grafana admin password
      community.general.ini_file:
        path: /etc/grafana/grafana.ini
        section: security
        option: admin_password
        value: "{{ vault_grafana_admin_password }}"
        mode: "0640"
      register: grafana_conf

    - name: Provision Prometheus datasource
      ansible.builtin.template:
        src: grafana-datasource.yml.j2
        dest: /etc/grafana/provisioning/datasources/keelinfra.yml
        mode: "0640"
        group: grafana
      register: grafana_ds

    - name: Create the dashboard directory
      ansible.builtin.file:
        path: "{{ grafana_dashboard_dir }}"
        state: directory
        owner: root
        group: grafana
        mode: "0750"

    - name: Install keelinfra dashboards
      ansible.builtin.copy:
        src: keelinfra-overview.json
        dest: "{{ grafana_dashboard_dir }}/keelinfra-overview.json"
        owner: root
        group: grafana
        mode: "0640"
      register: grafana_dash

    - name: Provision the dashboard directory
      ansible.builtin.template:
        src: grafana-dashboards.yml.j2
        dest: /etc/grafana/provisioning/dashboards/keelinfra.yml
        mode: "0640"
        group: grafana
      register: grafana_dash_provider

    - name: Restart grafana
      ansible.builtin.systemd:
        name: grafana-server
        state: >-
          {{ 'restarted' if (grafana_conf.changed or grafana_ds.changed or grafana_dash.changed
             or grafana_dash_provider.changed) else 'started' }}
        enabled: true
