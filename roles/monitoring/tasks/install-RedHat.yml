---
# RHEL, Rocky Linux and AlmaLinux 9 package none of the Prometheus tools, so
# they come from the upstream releases (checked against each release's
# sha256sums.txt) and run under the unit names Debian uses, with the same
# configuration paths: everything after this file is the same on both.
- name: Create the prometheus user
  ansible.builtin.user:
    name: prometheus
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/prometheus
    create_home: false

- name: Create the Prometheus directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "0755"
  loop:
    - {path: /etc/prometheus, owner: root}
    - {path: /var/lib/prometheus, owner: prometheus}
    - {path: "{{ textfile_dir }}", owner: root}
  loop_control:
    label: "{{ item.path }}"

- name: Install release binaries
  ansible.builtin.include_tasks: install_release.yml
  loop: >-
    {{ monitoring_releases | dict2items
       | selectattr('value.monitoring_host_only', 'equalto', false) | list
       + ((monitoring_releases | dict2items
           | selectattr('value.monitoring_host_only', 'equalto', true) | list)
          if inventory_hostname == monitoring_host else []) }}
  loop_control:
    loop_var: release
    label: "{{ release.key }} {{ release.value.version }}"

- name: Install the service units
  ansible.builtin.template:
    src: el-unit.service.j2
    dest: "/etc/systemd/system/{{ item.key }}.service"
    mode: "0644"
  loop: "{{ monitoring_el_units | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: inventory_hostname == monitoring_host or not item.value.monitoring_host_only
  notify: Restart monitoring services

# Started by the tasks after this file, once their configuration is in place.
- name: Reload systemd units
  ansible.builtin.systemd:
    daemon_reload: true

- name: Add Grafana repository (monitoring host)
  ansible.builtin.yum_repository:
    name: grafana
    description: Grafana (keelinfra)
    baseurl: https://rpm.grafana.com
    gpgcheck: true
    gpgkey: https://rpm.grafana.com/gpg.key
  when: inventory_hostname == monitoring_host and not dnf_offline | bool

- name: Install Grafana (monitoring host)
  ansible.builtin.dnf:
    name: grafana
    state: present
    disablerepo: "{{ '*' if dnf_offline | bool else omit }}"
    enablerepo: "{{ 'keelinfra-offline' if dnf_offline | bool else omit }}"
  when: inventory_hostname == monitoring_host
