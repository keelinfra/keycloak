---
prometheus_port: 9090
grafana_port: 3000
node_exporter_port: 9100
postgres_exporter_port: 9187
monitoring_host: "{{ groups['monitoring'][0] }}"
textfile_dir: /var/lib/prometheus/node-exporter
alertmanager_port: 9093
# Each alert links to its section in RUNBOOKS.md (annotation runbook_url).
alert_runbook_base: https://github.com/keelinfra/keycloak/blob/main/RUNBOOKS.md
grafana_dashboard_dir: /var/lib/grafana/dashboards/keelinfra
# Optional alert routing, set from alerting in the cluster definition
alerting: {}
# Debian's package puts amtool on PATH; the RHEL family install does not.
amtool_bin: "{{ '/usr/local/bin/amtool' if ansible_os_family == 'RedHat' else 'amtool' }}"

# RHEL family: upstream releases and the units that run them, named like
# the Debian packages' units.
monitoring_releases:
  node_exporter:
    repo: prometheus/node_exporter
    version: "1.9.1"
    binaries: [node_exporter]
    monitoring_host_only: false
  postgres_exporter:
    repo: prometheus-community/postgres_exporter
    version: "0.17.1"
    binaries: [postgres_exporter]
    monitoring_host_only: false
  prometheus:
    repo: prometheus/prometheus
    version: "3.5.0"
    binaries: [prometheus, promtool]
    monitoring_host_only: true
  alertmanager:
    repo: prometheus/alertmanager
    version: "0.28.1"
    binaries: [alertmanager, amtool]
    monitoring_host_only: true
monitoring_el_units:
  prometheus-node-exporter:
    description: Prometheus node exporter
    exec: >-
      /usr/local/bin/node_exporter --web.listen-address=:{{ node_exporter_port }}
      --collector.textfile.directory={{ textfile_dir }}
    monitoring_host_only: false
  prometheus-postgres-exporter:
    description: Prometheus PostgreSQL exporter
    env_file: /etc/default/prometheus-postgres-exporter
    exec: /usr/local/bin/postgres_exporter --web.listen-address=:{{ postgres_exporter_port }}
    monitoring_host_only: false
  prometheus:
    description: Prometheus
    exec: >-
      /usr/local/bin/prometheus --config.file=/etc/prometheus/prometheus.yml
      --storage.tsdb.path=/var/lib/prometheus/metrics2
      --web.listen-address=:{{ prometheus_port }}
    monitoring_host_only: true
  prometheus-alertmanager:
    description: Prometheus Alertmanager
    env_file: /etc/default/prometheus-alertmanager
    exec: >-
      /usr/local/bin/alertmanager --config.file=/etc/prometheus/alertmanager.yml
      --storage.path=/var/lib/prometheus/alertmanager $ARGS
    monitoring_host_only: true
