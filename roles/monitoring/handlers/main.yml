---
# RHEL family only: the units and binaries install-RedHat.yml manages.
- name: Restart monitoring services
  ansible.builtin.systemd:
    name: "{{ item.key }}"
    state: restarted
    daemon_reload: true
  loop: "{{ monitoring_el_units | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: inventory_hostname == monitoring_host or not item.value.monitoring_host_only
