---
- name: Install PostgreSQL and Patroni
  ansible.builtin.include_tasks: "install-{{ ansible_os_family }}.yml"

- name: Create patroni config directory
  ansible.builtin.file:
    path: /etc/patroni
    state: directory
    mode: "0750"
    owner: postgres
    group: postgres

- name: Render patroni configuration
  ansible.builtin.template:
    src: patroni.yml.j2
    dest: /etc/patroni/config.yml
    owner: postgres
    group: postgres
    mode: "0600"
  notify: Restart patroni

# Flush BEFORE first start: a pending restart handler firing at play end
# would interrupt the Patroni bootstrap mid-flight (it creates the
# replication user right after initdb — killing it there strands the
# cluster with no replicator role).
- name: Apply pending patroni restarts before bootstrap
  ansible.builtin.meta: flush_handlers

- name: Start patroni
  ansible.builtin.systemd:
    name: patroni
    state: started
    enabled: true

# /leader answers 200 only on the leader itself, so poll /cluster instead:
# any member can report whether a leader has been elected. Accepting 503
# here once skipped the keycloak-user creation on a slow bootstrap.
- name: Wait for a Patroni leader to emerge
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:{{ patroni_rest_port }}/cluster"
    return_content: true
  register: patroni_cluster
  until: >-
    patroni_cluster.status == 200
    and (patroni_cluster.json.members | default([])
         | selectattr('role', 'equalto', 'leader') | list | length > 0)
  retries: 60
  delay: 5
  changed_when: false

- name: Identify the current leader
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:{{ patroni_rest_port }}/leader"
    status_code: [200, 503]
  register: leader_probe
  changed_when: false

- name: Create Keycloak database objects (leader only)
  when: leader_probe.status == 200
  become: true
  become_user: postgres
  block:
    - name: Create keycloak role
      community.postgresql.postgresql_user:
        name: "{{ keycloak_db_user }}"
        password: "{{ vault_keycloak_db_password }}"

    - name: Create keycloak database
      community.postgresql.postgresql_db:
        name: "{{ keycloak_db_name }}"
        owner: "{{ keycloak_db_user }}"
