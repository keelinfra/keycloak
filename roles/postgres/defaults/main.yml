---
# Sized for small nodes; override in group_vars for real hardware.
postgres_parameters:
  max_connections: 200
  shared_buffers: 512MB
  effective_cache_size: 1GB
  work_mem: 8MB
  maintenance_work_mem: 128MB
  wal_compression: "on"
  log_min_duration_statement: 1000
# Synchronous replication: a commit returns only once one replica has it,
# and Patroni promotes only that replica, so a failover never loses a write
# Keycloak was told is saved. Costs one network round trip per commit. With
# one node there is no replica and this does nothing. Set false for
# asynchronous replication (a failover can then lose the last ~1 MB of WAL).
postgres_synchronous: true
