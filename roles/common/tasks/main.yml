---
- name: Check the operating system
  ansible.builtin.assert:
    that: >-
      ansible_os_family == 'Debian'
      or (ansible_os_family == 'RedHat' and ansible_distribution_major_version == '9'
          and ansible_distribution in ['RedHat', 'Rocky', 'AlmaLinux'])
    fail_msg: >-
      {{ inventory_hostname }} runs {{ ansible_distribution }} {{ ansible_distribution_version }}.
      The roles support the Debian family (Ubuntu 24.04 is tested) and RHEL,
      Rocky Linux or AlmaLinux 9 (Rocky Linux 9 is tested).
    quiet: true

- name: Note container mode
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} is a {{ ansible_virtualization_type }} container:
      hostname, kernel parameters and chrony are left to the container host
  when: keelinfra_container_mode | bool

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
  when: not (keelinfra_container_mode | bool)

- name: Ensure cluster nodes resolve each other via /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} keelinfra cluster hosts"
    block: |
      {% for node in cluster_nodes %}
      {{ node.host }} {{ node.name }}
      {% endfor %}
    # Docker bind-mounts /etc/hosts; replacing it atomically fails with EBUSY.
    unsafe_writes: "{{ keelinfra_container_mode | bool }}"

- name: Use the offline package repository
  when: keelinfra_offline_dir | default('') | length > 0
  ansible.builtin.include_tasks: offline_repo.yml

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: "{{ keelinfra_offline_dir | default('') | length == 0 }}"
    cache_valid_time: 3600
  when: ansible_os_family == 'Debian'

- name: Install base packages (RHEL family)
  ansible.builtin.dnf:
    name: "{{ common_packages_el }}"
    state: present
    disablerepo: "{{ '*' if dnf_offline | bool else omit }}"
    enablerepo: "{{ 'keelinfra-offline' if dnf_offline | bool else omit }}"
  when: ansible_os_family == 'RedHat'

# Ubuntu images ship cron running; minimal RHEL-family installs may not.
# pgBackRest's schedule and the backup metrics live in /etc/cron.d.
- name: Run cron (RHEL family)
  ansible.builtin.systemd:
    name: crond
    state: started
    enabled: true
  when: ansible_os_family == 'RedHat'

- name: Enable time synchronisation
  ansible.builtin.service:
    name: "{{ 'chronyd' if ansible_os_family == 'RedHat' else 'chrony' }}"
    state: started
    enabled: true
  when: not (keelinfra_container_mode | bool)

- name: Apply kernel parameters
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-keelinfra.conf
    reload: true
  loop: "{{ common_sysctl | dict2items }}"
  when: not (keelinfra_container_mode | bool)
