---
# Offline mode: serve packages from the repository in the bundle
# (bundle/build.sh), unpacked on the control node by ./configure --offline.
# Other configured sources are left alone, so a site with an internal
# mirror keeps it. On Ubuntu the bundle's repository is pinned above them;
# on the RHEL family every dnf task reads only the bundle's repository
# (dnf_offline_repos in playbooks/group_vars/all.yml). Either way the
# versions it ships are the ones installed and nothing is fetched from a
# source the node cannot reach.

- name: Read the offline bundle manifest
  ansible.builtin.set_fact:
    offline_bundle: "{{ lookup('ansible.builtin.file', keelinfra_offline_dir ~ '/bundle.yml') | from_yaml }}"

- name: Check the bundle matches this node
  ansible.builtin.assert:
    that:
      - >-
        (offline_bundle.family | default('debian') == 'debian'
         and ansible_distribution == 'Ubuntu'
         and ansible_distribution_release == offline_bundle.codename)
        or (offline_bundle.family | default('debian') == 'redhat'
            and ansible_os_family == 'RedHat'
            and ansible_distribution_major_version == offline_bundle.codename | string)
      - offline_bundle.arch == offline_arch_map[ansible_architecture] | default(ansible_architecture)
    fail_msg: >-
      The offline bundle is for {{ offline_bundle.os }} {{ offline_bundle.arch }};
      {{ inventory_hostname }} runs {{ ansible_distribution }} {{ ansible_distribution_version }}
      on {{ ansible_architecture }}. Build one for this node with bundle/build.sh --os and --arch.
    quiet: true

- name: Read the installed repository's bundle id
  ansible.builtin.slurp:
    src: "{{ offline_repo_dir }}/.bundle-id"
  register: offline_repo_id
  failed_when: false

- name: Install the bundle's package repository
  when: (offline_repo_id.content | default('') | b64decode | trim) != offline_bundle.repo_id
  block:
    - name: Remove a repository from an earlier bundle
      ansible.builtin.file:
        path: "{{ offline_repo_dir }}"
        state: absent

    - name: Create the repository directory
      ansible.builtin.file:
        path: "{{ offline_repo_dir }}"
        state: directory
        mode: "0755"

    # Copied, then unpacked with Python: a minimal RHEL-family node may not
    # have tar yet, and it would come from this very repository.
    - name: Copy the repository
      ansible.builtin.copy:
        src: "{{ keelinfra_offline_dir }}/repo.tar"
        dest: "{{ offline_repo_dir }}.tar"
        mode: "0600"

    - name: Unpack the repository
      ansible.builtin.command:
        argv:
          - "{{ ansible_python.executable }}"
          - -c
          - >-
            import sys, tarfile;
            kw = {'filter': 'data'} if hasattr(tarfile, 'data_filter') else {};
            tarfile.open(sys.argv[1]).extractall(sys.argv[2], **kw)
          - "{{ offline_repo_dir }}.tar"
          - "{{ offline_repo_dir }}"
      changed_when: true

    - name: Remove the copied archive
      ansible.builtin.file:
        path: "{{ offline_repo_dir }}.tar"
        state: absent

    - name: Record the bundle id
      ansible.builtin.copy:
        content: "{{ offline_bundle.repo_id }}\n"
        dest: "{{ offline_repo_dir }}/.bundle-id"
        mode: "0644"

- name: Add the repository as a dnf source
  when: ansible_os_family == 'RedHat'
  ansible.builtin.copy:
    content: |
      # keelinfra offline bundle ({{ offline_bundle.keycloak_version }}, built {{ offline_bundle.built }})
      # Disabled: the roles name it explicitly (dnf --enablerepo), so the
      # node's own dnf runs keep their usual sources. The packages were checked
      # against their repositories' signed metadata when the bundle was built,
      # and the bundle against its SHA256SUMS.
      [keelinfra-offline]
      name=keelinfra offline bundle
      baseurl=file://{{ offline_repo_dir }}
      enabled=0
      gpgcheck=0
      metadata_expire=never
    dest: /etc/yum.repos.d/keelinfra-offline.repo
    mode: "0644"

- name: Add the repository as an apt source
  when: ansible_os_family == 'Debian'
  ansible.builtin.copy:
    content: |
      # keelinfra offline bundle ({{ offline_bundle.keycloak_version }}, built {{ offline_bundle.built }})
      deb [trusted=yes] file:{{ offline_repo_dir }} ./
    dest: /etc/apt/sources.list.d/keelinfra-offline.list
    mode: "0644"

# 990: preferred over every other source (500), but below 1000, so apt
# never downgrades a package the node already has at a newer version.
- name: Prefer the repository over other sources
  when: ansible_os_family == 'Debian'
  ansible.builtin.copy:
    content: |
      Package: *
      Pin: release o=keelinfra-offline
      Pin-Priority: 990
    dest: /etc/apt/preferences.d/keelinfra-offline
    mode: "0644"

# Refresh only this source: the others may be unreachable, and an update
# that tries them fails or hangs. The apt module cannot limit the sources.
- name: Refresh the package index from the repository  # noqa: command-instead-of-module
  when: ansible_os_family == 'Debian'
  ansible.builtin.command:
    cmd: >-
      apt-get update
      -o Dir::Etc::sourcelist=sources.list.d/keelinfra-offline.list
      -o Dir::Etc::sourceparts=-
      -o APT::Get::List-Cleanup=0
  changed_when: false
