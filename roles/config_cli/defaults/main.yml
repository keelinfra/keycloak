---
# adorsys/keycloak-config-cli: release tag is the tool version, the jar is
# named after the newest Keycloak line it was built against.
config_cli_release: "6.5.1"
config_cli_kc_build: "26.5.5"
config_cli_dir: /opt/keycloak-config-cli
config_cli_base: https://github.com/adorsys/keycloak-config-cli/releases/download
config_cli_jar_url: "{{ config_cli_base }}/v{{ config_cli_release }}/keycloak-config-cli-{{ config_cli_kc_build }}.jar"
# runs once, on the first keycloak node
config_cli_host: "{{ groups['keycloak'][0] }}"
