---
# Render inventory/ from a cluster definition file. Runs locally, touches no target node.
- name: Configure cluster from definition file
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars:
    target_inventory_dir: "{{ playbook_dir }}/../inventory"
  tasks:
    - name: Load cluster definition
      ansible.builtin.include_vars:
        file: "{{ config_file }}"
        name: cfg

    - name: Read optional settings
      ansible.builtin.set_fact:
        smtp_username: "{{ ((cfg.alerting | default({})).email | default({})).username | default('') }}"

    - name: Validate cluster definition
      ansible.builtin.assert:
        that:
          - cfg.cluster_name is defined and cfg.cluster_name | length > 0
          - cfg.nodes is defined
          - cfg.nodes | length in [1, 3]
          - cfg.nodes | selectattr('host', 'undefined') | list | length == 0
          - cfg.nodes | selectattr('name', 'undefined') | list | length == 0
          - cfg.domain is defined and cfg.domain | length > 0
          - cfg.ssh_user is defined and cfg.ssh_user | length > 0
          - cfg.keycloak_version is defined
          - cfg.keycloak_version is match('^26\.[0-9]+\.[0-9]+$')
          - cfg.tls_mode | default('selfsigned') in ['selfsigned', 'custom']
        fail_msg: >-
          Invalid cluster definition. Required: cluster_name, domain, ssh_user,
          keycloak_version (26.x.y), and exactly 1 or 3 nodes each with host+name.

    - name: Validate the offline bundle
      when: offline_dir | default('') | length > 0
      vars:
        bundle: "{{ lookup('ansible.builtin.file', offline_dir ~ '/bundle.yml') | from_yaml }}"
      ansible.builtin.assert:
        that: bundle.keycloak_version == cfg.keycloak_version
        fail_msg: >-
          The offline bundle is for Keycloak {{ bundle.keycloak_version }}, the cluster
          definition asks for {{ cfg.keycloak_version }}. Build a bundle for
          {{ cfg.keycloak_version }} (bundle/build.sh --version {{ cfg.keycloak_version }}).
        quiet: true

    - name: Validate custom TLS certificate
      when: cfg.tls_mode | default('selfsigned') == 'custom'
      vars:
        config_dir: "{{ config_file | dirname }}"
        tls_cert_expiry: "{{ (tls_cert_info.not_after | to_datetime('%Y%m%d%H%M%SZ')).strftime('%Y-%m-%d') }}"
      block:
        - name: Require certificate and key paths
          ansible.builtin.assert:
            that:
              - cfg.tls_cert_file | default('') | length > 0
              - cfg.tls_key_file | default('') | length > 0
            fail_msg: >-
              tls_mode: custom needs tls_cert_file (PEM, server certificate first, then any
              intermediates) and tls_key_file (unencrypted PEM private key).
            quiet: true

        # Relative paths are relative to the cluster definition file.
        - name: Resolve certificate paths
          ansible.builtin.set_fact:
            tls_paths:
              cert: "{{ [config_dir, cfg.tls_cert_file | expanduser] | path_join | realpath }}"
              key: "{{ [config_dir, cfg.tls_key_file | expanduser] | path_join | realpath }}"
              ca: >-
                {{ ([config_dir, cfg.tls_ca_file | expanduser] | path_join | realpath)
                   if cfg.tls_ca_file | default('') | length > 0 else '' }}

        - name: Read certificate
          community.crypto.x509_certificate_info:
            path: "{{ tls_paths.cert }}"
            valid_at:
              in_30_days: "+30d"
          register: tls_cert_info

        - name: Read private key
          community.crypto.openssl_privatekey_info:
            path: "{{ tls_paths.key }}"
          register: tls_key_info

        - name: Read CA certificate
          community.crypto.x509_certificate_info:
            path: "{{ tls_paths.ca }}"
          when: tls_paths.ca | length > 0

        - name: Check certificate is not expired
          ansible.builtin.assert:
            that: not tls_cert_info.expired
            fail_msg: "{{ tls_paths.cert }} expired on {{ tls_cert_expiry }}."
            quiet: true

        - name: Check certificate covers the domain
          vars:
            sans: "{{ tls_cert_info.subject_alt_name | default([], true) | map('lower') | list }}"
            domain: "{{ cfg.domain | lower }}"
          ansible.builtin.assert:
            that: ('dns:' ~ domain) in sans or ('dns:*.' ~ domain.split('.', 1)[-1]) in sans
            fail_msg: >-
              {{ tls_paths.cert }} does not list {{ cfg.domain }} in its subject alternative
              names ({{ sans | join(', ') or 'none' }}).
            quiet: true

        - name: Check key matches certificate
          ansible.builtin.assert:
            that: tls_cert_info.public_key == tls_key_info.public_key
            fail_msg: "{{ tls_paths.key }} is not the private key for {{ tls_paths.cert }}."
            quiet: true

        - name: Warn when the certificate expires soon
          ansible.builtin.debug:
            msg: "Warning: {{ tls_paths.cert }} expires on {{ tls_cert_expiry }}, within 30 days."
          when: not tls_cert_info.valid_at.in_30_days

    - name: Validate off-site backup settings
      when: cfg.backup_s3 is defined
      block:
        - name: Require bucket, endpoint and region
          ansible.builtin.assert:
            that:
              - cfg.backup_s3 is mapping
              - cfg.backup_s3.endpoint | default('') | length > 0
              - cfg.backup_s3.bucket | default('') | length > 0
              - cfg.backup_s3.region | default('') | length > 0
              - cfg.backup_s3.uri_style | default('host') in ['host', 'path']
              - (cfg.backup_s3.retention_full | default(4) | int) >= 1
            fail_msg: >-
              backup_s3 needs endpoint (host or host:port), bucket and region;
              uri_style is "host" (AWS) or "path" (most self-hosted stores).
            quiet: true

        - name: Resolve the bucket CA path
          ansible.builtin.set_fact:
            backup_s3_ca_path: >-
              {{ ([config_file | dirname, cfg.backup_s3.ca_file | expanduser] | path_join | realpath)
                 if cfg.backup_s3.ca_file | default('') | length > 0 else '' }}

        - name: Read the bucket CA certificate
          community.crypto.x509_certificate_info:
            path: "{{ backup_s3_ca_path }}"
          when: backup_s3_ca_path | length > 0

    - name: Validate alert routing
      when: cfg.alerting is defined
      ansible.builtin.assert:
        that:
          - cfg.alerting is mapping
          - cfg.alerting.webhook_url is defined or cfg.alerting.email is defined
          - cfg.alerting.webhook_url | default('https://x') is match('^https?://')
          - cfg.alerting.email is not defined or (cfg.alerting.email.to | default('') | length > 0
              and cfg.alerting.email.from | default('') | length > 0
              and cfg.alerting.email.smarthost | default('') is match('^[^:]+:[0-9]+$'))
        fail_msg: >-
          alerting needs webhook_url (http or https), or email with to, from and
          smarthost (host:port), or both.
        quiet: true

    - name: Create inventory directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ target_inventory_dir }}"
        - "{{ target_inventory_dir }}/group_vars/all"

    - name: Render inventory hosts file
      ansible.builtin.template:
        src: templates/hosts.yml.j2
        dest: "{{ target_inventory_dir }}/hosts.yml"
        mode: "0644"

    - name: Render cluster group_vars
      ansible.builtin.template:
        src: templates/cluster.yml.j2
        dest: "{{ target_inventory_dir }}/group_vars/all/cluster.yml"
        mode: "0644"

    - name: Check for existing secrets
      ansible.builtin.stat:
        path: "{{ target_inventory_dir }}/group_vars/all/vault.yml"
      register: vault_file

    - name: Generate secrets (first run only)
      when: not vault_file.stat.exists
      block:
        - name: Render secrets file
          ansible.builtin.template:
            src: templates/vault.yml.j2
            dest: "{{ target_inventory_dir }}/group_vars/all/vault.yml"
            mode: "0600"

        - name: Encrypt secrets with ansible-vault
          ansible.builtin.command:
            cmd: >-
              ansible-vault encrypt
              {{ target_inventory_dir }}/group_vars/all/vault.yml
          changed_when: true

    # Credentials for the backup bucket and the SMTP relay never go in the
    # cluster definition (it is meant to be committed). They are read from
    # the environment on the run that first needs them, then kept encrypted
    # in vault_integrations.yml; later runs reuse them unless the variable is
    # set again.
    - name: Store integration credentials
      when: cfg.backup_s3 is defined or smtp_username | length > 0
      vars:
        integrations_file: "{{ target_inventory_dir }}/group_vars/all/vault_integrations.yml"
      block:
        - name: Check for stored integration credentials
          ansible.builtin.stat:
            path: "{{ integrations_file }}"
          register: integrations_stat

        - name: Load stored integration credentials
          ansible.builtin.include_vars:
            file: "{{ integrations_file }}"
            name: stored
          when: integrations_stat.stat.exists

        - name: Merge environment over stored credentials
          vars:
            prev: "{{ stored | default({}) }}"
          ansible.builtin.set_fact:
            integration_secrets:
              vault_backup_s3_key: "{{ lookup('env', 'KEELINFRA_S3_ACCESS_KEY') or prev.vault_backup_s3_key | default('') }}"
              vault_backup_s3_key_secret: "{{ lookup('env', 'KEELINFRA_S3_SECRET_KEY') or prev.vault_backup_s3_key_secret | default('') }}"
              vault_smtp_password: "{{ lookup('env', 'KEELINFRA_SMTP_PASSWORD') or prev.vault_smtp_password | default('') }}"
          no_log: true

        - name: Require the bucket credentials
          ansible.builtin.assert:
            that:
              - integration_secrets.vault_backup_s3_key | length > 0
              - integration_secrets.vault_backup_s3_key_secret | length > 0
            fail_msg: >-
              backup_s3 is set but no bucket credentials are stored yet. Run
              KEELINFRA_S3_ACCESS_KEY=... KEELINFRA_S3_SECRET_KEY=... ./configure -c <file>
            quiet: true
          when: cfg.backup_s3 is defined

        - name: Require the SMTP password
          ansible.builtin.assert:
            that: integration_secrets.vault_smtp_password | length > 0
            fail_msg: >-
              alerting.email.username is set but no SMTP password is stored yet. Run
              KEELINFRA_SMTP_PASSWORD=... ./configure -c <file>
            quiet: true
          when: smtp_username | length > 0

        - name: Write integration credentials
          when: stored is not defined or stored != integration_secrets
          ansible.builtin.copy:
            content: "{{ '---\n' ~ (integration_secrets | to_nice_yaml) }}"
            dest: "{{ integrations_file }}"
            mode: "0600"
          no_log: true

        - name: Encrypt integration credentials
          when: stored is not defined or stored != integration_secrets
          ansible.builtin.command:
            cmd: ansible-vault encrypt {{ integrations_file }}
          changed_when: true

    - name: Check SSH reachability of all nodes
      ansible.builtin.command:
        cmd: >-
          ssh -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new
          {% if cfg.ssh_private_key is defined %}-i {{ cfg.ssh_private_key }}{% endif %}
          {{ cfg.ssh_user }}@{{ item.host }} sudo -n true
      loop: "{{ cfg.nodes }}"
      loop_control:
        label: "{{ item.name }} ({{ item.host }})"
      when: item.connection | default('ssh') != 'local'
      changed_when: false
      register: ssh_check
      ignore_errors: true

    - name: Report unreachable nodes
      ansible.builtin.fail:
        msg: >-
          Cannot reach {{ ssh_check.results | select('failed') | map(attribute='item.name') | join(', ') }}
          via SSH with passwordless sudo. Fix connectivity and re-run ./configure.
      when: ssh_check.results | rejectattr('skipped', 'defined') | select('failed') | list | length > 0

    - name: Summary
      ansible.builtin.debug:
        msg: >-
          Cluster '{{ cfg.cluster_name }}': {{ cfg.nodes | length }} node(s),
          Keycloak {{ cfg.keycloak_version }}, domain https://{{ cfg.domain }}.
          Inventory written to inventory/.
