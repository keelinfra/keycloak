---
# Deployment constants shared across roles. Not user-facing — user config
# lives in the cluster definition consumed by ./configure.
postgres_version: 17
postgres_port: 5432
patroni_rest_port: 8008
# The postgres user's home: Debian's postgresql-common and PGDG's RPMs
# (RHEL, Rocky, AlmaLinux) put it, and the binaries, in different places.
postgres_home: "{{ '/var/lib/pgsql' if ansible_os_family == 'RedHat' else '/var/lib/postgresql' }}"
postgres_data_dir: "{{ postgres_home }}/{{ postgres_version }}/patroni"
postgres_bin_dir: >-
  {{ '/usr/pgsql-' ~ postgres_version ~ '/bin' if ansible_os_family == 'RedHat'
     else '/usr/lib/postgresql/' ~ postgres_version ~ '/bin' }}
# Offline installs on the RHEL family: every dnf task reads only the
# bundle's repository (roles/common/tasks/offline_repo.yml), since dnf
# fails on a configured source it cannot reach. Passed to dnf and package
# tasks as disablerepo/enablerepo; omitted otherwise.
dnf_offline: >-
  {{ ansible_os_family == 'RedHat' and (keelinfra_offline_dir | default('') | length > 0) }}
keycloak_db_name: keycloak
keycloak_db_user: keycloak
haproxy_pg_port: 5433
haproxy_https_port: 443
keycloak_https_port: 8443
keycloak_mgmt_port: 9000
tls_dir: /etc/keelinfra/tls
# Traffic between the nodes (etcd, Patroni API, PostgreSQL, metrics) over
# TLS with a cluster-internal CA, separate from the certificate users see.
# ./configure writes internal_tls: true into the inventory unless the
# cluster file opts out. It is not defaulted here (this file would override
# the inventory); every use reads internal_tls | default(false), which keeps
# clusters installed before it, whose inventory lacks the setting, as they were.
internal_tls_dir: "{{ tls_dir }}/internal"
internal_ca_file: "{{ internal_tls_dir }}/ca.crt"
internal_cert_file: "{{ internal_tls_dir }}/node.crt"
internal_key_file: "{{ internal_tls_dir }}/node.key"
# ./verify fails, and CertificateExpiringSoon fires, when a certificate the
# cluster uses expires within this many days.
cert_warn_days: 30
etcd_scheme: "{{ 'https' if internal_tls | default(false) | bool else 'http' }}"
patroni_api_scheme: "{{ 'https' if internal_tls | default(false) | bool else 'http' }}"
# Never rely on the host's default `java` — CI runners preinstall several
# JDKs with an older one on PATH. Everything JVM-based points here.
java_home: >-
  {{ '/usr/lib/jvm/jre-21-openjdk' if ansible_os_family == 'RedHat'
     else '/usr/lib/jvm/java-21-openjdk-' ~ ('arm64' if ansible_architecture == 'aarch64' else 'amd64') }}
# Prometheus and Alertmanager run on the first node, next to Grafana, and on
# the next node, so alerts still go out while either machine is down. The
# two Alertmanagers share their state and send each alert once.
alerting_hosts: "{{ (([groups['monitoring'][0]] + groups['cluster']) | unique)[:2] }}"
# Root CAs removed from every node's trust stores (system bundle and Java),
# without waiting for the OS packages: roles/common/tasks/trust.yml applies
# it, ./verify checks it, ./update-trust applies it to a running cluster.
# Each entry: the certificate in roles/common/files/distrust/, its SHA-256,
# and its name in Debian's /etc/ca-certificates.conf.
distrusted_cas:
  # Eight eMudhra intermediates chain to it whose private keys anyone can
  # recover from the certificates (disclosed 2026-10-17). Mozilla, Debian
  # and Ubuntu removed it on 2026-10-20; Red Hat advises blocking it.
  - name: emSign ECC Root CA - G3
    file: emSign_ECC_Root_CA_-_G3.pem
    sha256: 86A1ECBA089C4A8D3BBE2734C612BA341D813E043CF9E8A862CD5C57A36BBE6B
    debian_conf: mozilla/emSign_ECC_Root_CA_-_G3.crt
  # Cross-signed the same eight keys. Mozilla and Chrome no longer trust it
  # for TLS; Red Hat's workaround blocks it too.
  - name: AAA Certificate Services
    file: Comodo_AAA_Services_root.pem
    sha256: D7A7A0FB5D7E2731D771E9484EBCDEF71D5F0C3E0A2948782BC83EE0EA699EF4
    debian_conf: mozilla/Comodo_AAA_Services_root.crt
trust_bundle: >-
  {{ '/etc/pki/tls/certs/ca-bundle.crt' if ansible_os_family == 'RedHat'
     else '/etc/ssl/certs/ca-certificates.crt' }}
# The JDK's cacerts; both families build it from the system trust store.
java_trust_store: >-
  {{ '/etc/pki/ca-trust/extracted/java/cacerts' if ansible_os_family == 'RedHat'
     else '/etc/ssl/certs/java/cacerts' }}
