---
# keelinfra/keycloak — health checks and operational drills.
# ./verify                     → health only
# ./verify --drill failover    → Patroni switchover + write test
# ./verify --drill restore     → pgBackRest restore to a scratch directory
# ./verify --drill session     → login, rolling restart, session must survive
# ./verify --drill alert       → send a test alert to the configured receivers
# ./verify --drill all         → everything above
# ./verify --drill crash       → freeze the PostgreSQL leader mid-write; no
#                                acknowledged write may be lost (not in "all":
#                                writes pause for about half a minute)

- name: Health checks
  hosts: cluster
  vars:
    drill: health
  tags: [health]
  tasks:
    - name: Patroni member state
      ansible.builtin.uri:
        url: "{{ patroni_api_scheme }}://{{ ansible_host }}:{{ patroni_rest_port }}/health"
        ca_path: "{{ internal_ca_file if internal_tls | default(false) | bool else omit }}"
        status_code: 200
      changed_when: false

    - name: Etcd endpoint health
      ansible.builtin.command:
        cmd: >-
          /usr/local/bin/etcdctl --endpoints={{ etcd_scheme }}://127.0.0.1:2379
          {% if internal_tls | default(false) | bool %}--cacert={{ internal_ca_file }}
          --cert={{ internal_cert_file }} --key={{ internal_key_file }}{% endif %}
          endpoint health
      changed_when: false

    - name: Keycloak readiness
      ansible.builtin.uri:
        url: "https://127.0.0.1:{{ keycloak_mgmt_port }}/health/ready"
        validate_certs: false
        status_code: 200
      changed_when: false

    - name: PostgreSQL reachable through haproxy
      become: true
      become_user: postgres
      community.postgresql.postgresql_query:
        login_host: 127.0.0.1
        login_port: "{{ haproxy_pg_port }}"
        login_user: "{{ keycloak_db_user }}"
        login_password: "{{ vault_keycloak_db_password }}"
        login_db: "{{ keycloak_db_name }}"
        ssl_mode: "{{ 'verify-ca' if internal_tls | default(false) | bool else 'prefer' }}"
        ca_cert: "{{ internal_ca_file if internal_tls | default(false) | bool else omit }}"
        query: SELECT 1
      changed_when: false

    # Every port one node talks to on another must answer in TLS: etcd
    # (clients, peers), the Patroni API, PostgreSQL, Keycloak (HTTPS,
    # management, cluster transport) and the exporters Prometheus scrapes.
    # Not 57800: JGroups failure detection, liveness pings only, stays plain.
    # 7800 only with several nodes: a single node has no cluster peers, and
    # JGroups may bind elsewhere than a loopback node address.
    - name: Check the ports between the nodes speak TLS
      when: internal_tls | default(false) | bool
      block:
        - name: Probe every node's ports for TLS
          ansible.builtin.script:
            cmd: >-
              files/tls-probe.py
              {% for node in cluster_nodes %}
              {{ node.host }}:2379 {{ node.host }}:2380 {{ node.host }}:{{ patroni_rest_port }}
              {{ node.host }}:{{ postgres_port }}:pg {{ node.host }}:{{ keycloak_https_port }}
              {{ node.host }}:{{ keycloak_mgmt_port }}
              {{ (node.host ~ ':7800') if cluster_nodes | length > 1 else '' }}
              {{ node.host }}:{{ node_exporter_port | default(9100) }}
              {{ node.host }}:{{ postgres_exporter_port | default(9187) }}
              {% endfor %}
            executable: python3
          register: tls_probe
          changed_when: false
          failed_when: tls_probe.rc != 0

        - name: Show the TLS probe
          ansible.builtin.debug:
            msg: "{{ tls_probe.stdout_lines }}"
          run_once: true

        # A loopback node address (single-node evaluation installs) falls
        # under the plain local rule, which is not traffic between nodes.
        - name: Try a plaintext PostgreSQL connection to every node
          ansible.builtin.command:
            cmd: >-
              {{ postgres_bin_dir }}/psql -w -c 'SELECT 1'
              "host={{ item.host }} port={{ postgres_port }} dbname={{ keycloak_db_name }}
              user={{ keycloak_db_user }} sslmode=disable connect_timeout=5"
          loop: "{{ cluster_nodes | rejectattr('host', 'match', '^127\\.') | list }}"
          loop_control:
            label: "{{ item.name }}"
          register: pg_plain
          changed_when: false
          failed_when: >-
            pg_plain.rc == 0 or 'no encryption' not in pg_plain.stderr

        - name: Count database connections from the nodes without TLS
          become: true
          become_user: postgres
          community.postgresql.postgresql_query:
            login_db: postgres
            query: >-
              SELECT count(*) AS plain FROM pg_stat_activity a JOIN pg_stat_ssl s USING (pid)
              WHERE a.client_addr IS NOT NULL AND NOT host(a.client_addr) IN ('127.0.0.1', '::1')
              AND NOT s.ssl
          register: pg_plain_sessions
          changed_when: false
          failed_when: pg_plain_sessions.query_result[0].plain | int > 0

    - name: Check certificates
      ansible.builtin.include_tasks: tasks/cert-check.yml

    - name: Cluster summary
      ansible.builtin.command:
        cmd: patronictl -c /etc/patroni/config.yml list
      register: patroni_list
      changed_when: false
      run_once: true

    - name: Show cluster
      ansible.builtin.debug:
        msg: "{{ patroni_list.stdout_lines }}"
      run_once: true

    # A replica confirms every commit (roles/postgres, postgres_synchronous),
    # so a failover cannot lose a saved write. Right after a failover Patroni
    # takes a loop or two to name the new synchronous replica.
    - name: Look for the synchronous replica
      ansible.builtin.command:
        cmd: patronictl -c /etc/patroni/config.yml list -f json
      register: patroni_sync
      until: >-
        (patroni_sync.stdout | from_json) | selectattr('Role', 'equalto', 'Sync Standby') | list | length > 0
      retries: 12
      delay: 5
      failed_when: false
      changed_when: false
      run_once: true
      when: postgres_synchronous | default(true) | bool and groups['postgres'] | length > 1

    - name: One replica confirms every commit
      ansible.builtin.assert:
        that: (patroni_sync.stdout | from_json) | selectattr('Role', 'equalto', 'Sync Standby') | list | length > 0
        fail_msg: >-
          No replica is synchronous, so a failover could lose the last writes. Clusters
          installed before synchronous replication need ./install once to turn it on.
          Cluster state: {{ patroni_sync.stdout }}
        quiet: true
      run_once: true
      when: postgres_synchronous | default(true) | bool and groups['postgres'] | length > 1

- name: Backup and monitoring health
  hosts: monitoring
  gather_facts: false
  vars:
    backup_repos: "{{ [1, 2] if backup_s3 | default({}) | length > 0 else [1] }}"
    # Every metric an alert rule or the overview dashboard depends on. A
    # renamed or missing one would leave an alert that can never fire.
    required_metrics:
      - up{job="keycloak"}
      - jvm_memory_used_bytes{job="keycloak"}
      - http_server_requests_seconds_count
      - agroal_active_count
      - patroni_primary
      - patroni_replica
      - patroni_postgres_running
      - patroni_xlog_location
      - patroni_xlog_replayed_location
      - etcd_server_has_leader
      - pgbackrest_last_backup_timestamp
      - node_filesystem_avail_bytes
      - node_cpu_seconds_total
      - keelinfra_cert_expiry_timestamp
  tasks:
    - name: Every repository holds a backup
      become: true
      become_user: postgres
      ansible.builtin.command:
        cmd: pgbackrest --stanza=main --repo={{ item }} info --output=json
      loop: "{{ backup_repos }}"
      register: repo_info
      changed_when: false
      failed_when: >-
        repo_info.rc != 0
        or not (repo_info.stdout | from_json)
        or (repo_info.stdout | from_json)[0].backup | default([]) | length == 0

    - name: Prometheus is ready
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ prometheus_port | default(9090) }}/-/ready"
      changed_when: false

    - name: Alertmanager is ready
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ alertmanager_port | default(9093) }}/-/ready"
      changed_when: false

    - name: Prometheus sends alerts to Alertmanager
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ prometheus_port | default(9090) }}/api/v1/alertmanagers"
        return_content: true
      register: prom_am
      until: prom_am.json.data.activeAlertmanagers | length > 0
      retries: 10
      delay: 3
      changed_when: false

    - name: Every scrape target is up
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ prometheus_port | default(9090) }}/api/v1/targets?state=active"
        return_content: true
      register: prom_targets
      until: >-
        prom_targets.json.data.activeTargets | length > 0
        and prom_targets.json.data.activeTargets | rejectattr('health', 'equalto', 'up') | list | length == 0
      retries: 20
      delay: 6
      changed_when: false

    - name: Refresh the backup metrics
      ansible.builtin.command: /usr/local/bin/pgbackrest-metrics
      changed_when: false

    - name: Every metric the alerts and dashboard use has data
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ prometheus_port | default(9090) }}/api/v1/query?query={{ item | urlencode }}"
        return_content: true
      loop: "{{ required_metrics }}"
      register: metric_query
      until: metric_query.json.data.result | length > 0
      retries: 10
      delay: 6
      changed_when: false

    - name: Grafana serves the keelinfra dashboard
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ grafana_port | default(3000) }}/api/dashboards/uid/keelinfra-overview"
        user: admin
        password: "{{ vault_grafana_admin_password }}"
        force_basic_auth: true
      register: grafana_dash
      until: grafana_dash.status == 200
      retries: 10
      delay: 3
      changed_when: false

- name: Failover drill
  hosts: primary
  gather_facts: false
  tasks:
    - name: Run failover drill
      when: drill | default('health') in ['failover', 'all']
      block:
        - name: Find current leader
          ansible.builtin.command:
            cmd: patronictl -c /etc/patroni/config.yml list -f json
          register: cluster_state
          changed_when: false

        - name: Pick the leader and the streaming replicas
          ansible.builtin.set_fact:
            current_leader: >-
              {{ (cluster_state.stdout | from_json)
                 | selectattr('Role', 'equalto', 'Leader')
                 | map(attribute='Member') | first }}
            # The synchronous replica first: with synchronous replication
            # Patroni switches over only to it.
            streaming_replicas: >-
              {{ ((cluster_state.stdout | from_json)
                  | selectattr('Role', 'equalto', 'Sync Standby')
                  | selectattr('State', 'equalto', 'streaming')
                  | map(attribute='Member') | list)
                 + ((cluster_state.stdout | from_json)
                  | selectattr('Role', 'equalto', 'Replica')
                  | selectattr('State', 'equalto', 'streaming')
                  | map(attribute='Member') | list) }}

        - name: A switchover needs a streaming replica to switch to
          ansible.builtin.assert:
            that: streaming_replicas | length > 0
            fail_msg: >-
              No replica is streaming from {{ current_leader }}. The failover drill
              needs at least two Patroni members; it cannot run on a single node.
              Cluster state: {{ cluster_state.stdout }}

        - name: Choose the switchover target
          ansible.builtin.set_fact:
            switch_target: "{{ streaming_replicas | first }}"

        - name: Switch the PostgreSQL leader over to a replica
          ansible.builtin.command:
            cmd: patronictl -c /etc/patroni/config.yml switchover --leader {{ current_leader }} --candidate {{ switch_target }} --force
          changed_when: true

        - name: Confirm the leader moved to the switchover target
          ansible.builtin.command:
            cmd: patronictl -c /etc/patroni/config.yml list -f json
          register: cluster_after
          changed_when: false
          until: >-
            (cluster_after.stdout | from_json)
            | selectattr('Role', 'equalto', 'Leader')
            | map(attribute='Member') | list == [switch_target]
          retries: 20
          delay: 3

        - name: Write through haproxy after switchover
          become: true
          become_user: postgres
          community.postgresql.postgresql_query:
            login_host: 127.0.0.1
            login_port: "{{ haproxy_pg_port }}"
            login_user: "{{ keycloak_db_user }}"
            login_password: "{{ vault_keycloak_db_password }}"
            login_db: "{{ keycloak_db_name }}"
            query: "CREATE TABLE IF NOT EXISTS keelinfra_drill (at timestamptz); INSERT INTO keelinfra_drill VALUES (now())"
          register: write_test
          retries: 10
          delay: 3
          until: write_test is succeeded
          changed_when: true

        - name: Failover drill passed
          ansible.builtin.debug:
            msg: "✓ switchover {{ current_leader }} → {{ switch_target }} complete, writes OK through haproxy"

# The leader stops answering mid-write, as a hung machine or a cut network
# would: every process of its Patroni unit is frozen (SIGSTOP), so it neither
# releases its leadership nor restarts. A node that is not the leader writes
# one row per connection through its local HAProxy and logs every insert
# PostgreSQL acknowledged. Patroni promotes the synchronous replica once the
# leader's lock expires; every acknowledged row must be there, and the
# longest gap between acknowledgements is how long writes paused. Then the
# old leader is thawed and must come back as a replica.
- name: Crash drill
  hosts: primary
  gather_facts: false
  vars:
    crash_dir: /tmp/keelinfra-crash
    patronictl: patronictl -c /etc/patroni/config.yml
  tasks:
    - name: Run crash drill
      when: drill | default('health') == 'crash'
      block:
        - name: Find the leader
          ansible.builtin.command:
            cmd: "{{ patronictl }} list -f json"
          register: crash_before
          changed_when: false

        - name: Pick the leader and a node to write from
          ansible.builtin.set_fact:
            crash_leader: >-
              {{ (crash_before.stdout | from_json) | selectattr('Role', 'equalto', 'Leader')
                 | map(attribute='Member') | first }}
            crash_writer: >-
              {{ (crash_before.stdout | from_json) | rejectattr('Role', 'equalto', 'Leader')
                 | map(attribute='Member') | first | default('') }}

        - name: The crash drill needs a replica that confirms every commit
          ansible.builtin.assert:
            that:
              - crash_writer | length > 0
              - (crash_before.stdout | from_json) | selectattr('Role', 'equalto', 'Sync Standby') | list | length > 0
            fail_msg: >-
              The crash drill needs at least two nodes and synchronous replication
              (postgres_synchronous). Cluster state: {{ crash_before.stdout }}

        - name: Prepare the writer on {{ crash_writer }}
          delegate_to: "{{ crash_writer }}"
          become: true
          block:
            - name: Create the drill directory
              ansible.builtin.file:
                path: "{{ crash_dir }}"
                state: directory
                owner: postgres
                mode: "0700"

            - name: Write the database password file
              ansible.builtin.copy:
                dest: "{{ crash_dir }}/pgpass"
                content: "127.0.0.1:{{ haproxy_pg_port }}:{{ keycloak_db_name }}:{{ keycloak_db_user }}:{{ vault_keycloak_db_password }}\n"
                owner: postgres
                mode: "0600"
              no_log: true

            - name: Write the writer script
              ansible.builtin.copy:
                dest: "{{ crash_dir }}/writer.sh"
                owner: postgres
                mode: "0700"
                content: |
                  #!/bin/bash
                  # keelinfra crash drill: one insert per connection through the local
                  # HAProxy; "<id> <epoch>" for every insert PostgreSQL acknowledged.
                  dir=$1
                  export PGPASSFILE=$dir/pgpass PGCONNECT_TIMEOUT=3
                  psql=$(command -v psql || echo /usr/pgsql-{{ postgres_version }}/bin/psql)
                  conn="host=127.0.0.1 port={{ haproxy_pg_port }}"
                  conn="$conn dbname={{ keycloak_db_name }} user={{ keycloak_db_user }}"
                  {% if internal_tls | default(false) | bool %}
                  conn="$conn sslmode=verify-ca sslrootcert={{ internal_ca_file }}"
                  {% endif %}
                  i=0
                  while [ ! -e "$dir/stop" ]; do
                    i=$((i + 1))
                    if timeout 5 "$psql" "$conn" -qAtX -v ON_ERROR_STOP=1 \
                        -c "INSERT INTO keelinfra_crash VALUES ($i)" > /dev/null 2>&1; then
                      echo "$i $(date +%s.%N)" >> "$dir/acked"
                    else
                      sleep 0.2
                    fi
                  done

            - name: Start with an empty log
              ansible.builtin.file:
                path: "{{ crash_dir }}/{{ item }}"
                state: absent
              loop: [acked, stop]

            - name: Create the drill table
              become: true
              become_user: postgres
              community.postgresql.postgresql_query:
                login_host: 127.0.0.1
                login_port: "{{ haproxy_pg_port }}"
                login_user: "{{ keycloak_db_user }}"
                login_password: "{{ vault_keycloak_db_password }}"
                login_db: "{{ keycloak_db_name }}"
                ssl_mode: "{{ 'verify-ca' if internal_tls | default(false) | bool else 'prefer' }}"
                ca_cert: "{{ internal_ca_file if internal_tls | default(false) | bool else omit }}"
                query: DROP TABLE IF EXISTS keelinfra_crash; CREATE TABLE keelinfra_crash (id int PRIMARY KEY)
              changed_when: true

            - name: Start writing
              become: true
              become_user: postgres
              ansible.builtin.command:
                cmd: "{{ crash_dir }}/writer.sh {{ crash_dir }}"
              async: 900
              poll: 0
              changed_when: true

            - name: Wait until writes are acknowledged
              ansible.builtin.command:
                cmd: wc -l {{ crash_dir }}/acked
              register: crash_warmup
              until: crash_warmup.rc == 0 and (crash_warmup.stdout.split() | first | int) >= 20
              retries: 30
              delay: 1
              changed_when: false

        - name: Freeze the leader and check the takeover
          block:
            - name: Freeze every process of Patroni and PostgreSQL on {{ crash_leader }}
              delegate_to: "{{ crash_leader }}"
              become: true
              ansible.builtin.command:
                cmd: systemctl kill --signal=SIGSTOP patroni
              changed_when: true

            - name: Wait for another node to take over
              delegate_to: "{{ crash_writer }}"
              ansible.builtin.command:
                cmd: "{{ patronictl }} list -f json"
              register: crash_takeover
              until: >-
                crash_takeover.rc == 0 and
                ((crash_takeover.stdout | from_json) | selectattr('Role', 'equalto', 'Leader')
                 | selectattr('State', 'equalto', 'running') | map(attribute='Member') | list
                 | reject('equalto', crash_leader) | list | length) == 1
              retries: 40
              delay: 3
              changed_when: false

            - name: Let writes run on the new leader
              ansible.builtin.pause:
                seconds: 10

          always:
            - name: Stop writing
              delegate_to: "{{ crash_writer }}"
              become: true
              ansible.builtin.file:
                path: "{{ crash_dir }}/stop"
                state: touch
                owner: postgres
                mode: "0600"

            - name: Let the last insert finish
              ansible.builtin.pause:
                seconds: 6

            - name: Remove the database password file
              delegate_to: "{{ crash_writer }}"
              become: true
              ansible.builtin.file:
                path: "{{ crash_dir }}/pgpass"
                state: absent

            - name: Thaw {{ crash_leader }}
              delegate_to: "{{ crash_leader }}"
              become: true
              ansible.builtin.command:
                cmd: systemctl kill --signal=SIGCONT patroni
              changed_when: true

        - name: Read what PostgreSQL acknowledged
          delegate_to: "{{ crash_writer }}"
          become: true
          ansible.builtin.command:
            cmd: cat {{ crash_dir }}/acked
          register: crash_acked
          changed_when: false

        - name: Measure the longest pause between acknowledged writes
          delegate_to: "{{ crash_writer }}"
          become: true
          ansible.builtin.shell:
            cmd: >-
              awk 'NR > 1 { g = $2 - p; if (g > m) m = g } { p = $2 } END { printf "%.0f", m }'
              {{ crash_dir }}/acked
          register: crash_pause
          changed_when: false

        - name: Count the acknowledged rows on the new leader
          delegate_to: "{{ crash_writer }}"
          become: true
          become_user: postgres
          community.postgresql.postgresql_query:
            login_host: 127.0.0.1
            login_port: "{{ haproxy_pg_port }}"
            login_user: "{{ keycloak_db_user }}"
            login_password: "{{ vault_keycloak_db_password }}"
            login_db: "{{ keycloak_db_name }}"
            ssl_mode: "{{ 'verify-ca' if internal_tls | default(false) | bool else 'prefer' }}"
            ca_cert: "{{ internal_ca_file if internal_tls | default(false) | bool else omit }}"
            query: SELECT count(*) AS present FROM keelinfra_crash WHERE id = ANY(%(ids)s::int[])
            named_args:
              ids: "{{ crash_acked.stdout_lines | map('split') | map('first') | map('int') | list }}"
          register: crash_present
          changed_when: false

        - name: Wait for the old leader to come back as a replica, {{ crash_leader }}
          delegate_to: "{{ crash_writer }}"
          ansible.builtin.command:
            cmd: "{{ patronictl }} list -f json"
          register: crash_after
          until: >-
            crash_after.rc == 0 and
            ((crash_after.stdout | from_json) | selectattr('Member', 'equalto', crash_leader)
             | selectattr('Role', 'in', ['Replica', 'Sync Standby'])
             | selectattr('State', 'equalto', 'streaming') | list | length) == 1
          retries: 40
          delay: 3
          changed_when: false

        - name: No acknowledged write may be lost
          ansible.builtin.assert:
            that: crash_present.query_result[0].present | int == crash_acked.stdout_lines | length
            fail_msg: >-
              {{ crash_acked.stdout_lines | length - crash_present.query_result[0].present | int }}
              of {{ crash_acked.stdout_lines | length }} acknowledged writes are missing after the takeover.
            success_msg: >-
              ✓ {{ crash_leader }} frozen mid-write: {{ crash_takeover.stdout | from_json
              | selectattr('Role', 'equalto', 'Leader') | map(attribute='Member') | first }} took over,
              writes paused {{ crash_pause.stdout }} s, {{ crash_acked.stdout_lines | length }}
              acknowledged writes, none lost; {{ crash_leader }} is back as a replica

        - name: Remove the drill table and files
          delegate_to: "{{ crash_writer }}"
          become: true
          block:
            - name: Drop the drill table
              become: true
              become_user: postgres
              community.postgresql.postgresql_query:
                login_host: 127.0.0.1
                login_port: "{{ haproxy_pg_port }}"
                login_user: "{{ keycloak_db_user }}"
                login_password: "{{ vault_keycloak_db_password }}"
                login_db: "{{ keycloak_db_name }}"
                ssl_mode: "{{ 'verify-ca' if internal_tls | default(false) | bool else 'prefer' }}"
                ca_cert: "{{ internal_ca_file if internal_tls | default(false) | bool else omit }}"
                query: DROP TABLE IF EXISTS keelinfra_crash
              changed_when: true

            - name: Remove the drill directory
              ansible.builtin.file:
                path: "{{ crash_dir }}"
                state: absent

- name: Restore drill
  hosts: backup_repo
  gather_facts: false
  vars:
    backup_repos: "{{ [1, 2] if backup_s3 | default({}) | length > 0 else [1] }}"
  tasks:
    - name: Restore the latest backup of every repository to a scratch directory
      when: drill | default('health') in ['restore', 'all']
      ansible.builtin.include_tasks: tasks/restore_drill_repo.yml
      loop: "{{ backup_repos }}"
      loop_control:
        loop_var: repo

- name: Session survival drill
  hosts: primary
  gather_facts: false
  vars:
    # Through this node's HAProxy, the way clients reach the cluster — so the
    # drill also proves the load balancer keeps serving across the restarts.
    kc_token_url: "https://127.0.0.1:{{ haproxy_https_port }}/realms/demo/protocol/openid-connect/token"
  tasks:
    - name: Run session drill
      when: drill | default('health') in ['session', 'all']
      block:
        - name: Open an online session on the demo realm (password grant)
          ansible.builtin.uri:
            url: "{{ kc_token_url }}"
            method: POST
            validate_certs: false
            body_format: form-urlencoded
            body:
              grant_type: password
              client_id: keelinfra-drill
              username: demo
              password: demo12345
              scope: openid
            status_code: 200
          register: login

        - name: Open an offline session as well
          # Offline sessions persist through OFFLINE_USER_SESSION /
          # OFFLINE_CLIENT_SESSION — a different code path from online ones,
          # and the one upstream #51920 reported write conflicts on.
          ansible.builtin.uri:
            url: "{{ kc_token_url }}"
            method: POST
            validate_certs: false
            body_format: form-urlencoded
            body:
              grant_type: password
              client_id: keelinfra-drill
              username: demo
              password: demo12345
              scope: openid offline_access
            status_code: 200
          register: offline_login

        - name: Read the claims of the pre-restart session
          ansible.builtin.set_fact:
            claims_before: >-
              {{ ((login.json.access_token.split('.')[1] | replace('-', '+') | replace('_', '/'))
                  ~ ('=' * ((4 - (login.json.access_token.split('.')[1] | length) % 4) % 4)))
                 | b64decode | from_json }}

        - name: Restart every Keycloak node in turn, each back to ready before the next
          ansible.builtin.include_tasks: tasks/restart_keycloak_node.yml
          loop: "{{ groups['keycloak'] }}"
          loop_control:
            loop_var: kc_node

        - name: Refresh the pre-restart online session
          ansible.builtin.uri:
            url: "{{ kc_token_url }}"
            method: POST
            validate_certs: false
            body_format: form-urlencoded
            body:
              grant_type: refresh_token
              client_id: keelinfra-drill
              refresh_token: "{{ login.json.refresh_token }}"
            status_code: 200
          register: refreshed
          until: refreshed.status == 200
          retries: 10
          delay: 3

        - name: Refresh the pre-restart offline session
          ansible.builtin.uri:
            url: "{{ kc_token_url }}"
            method: POST
            validate_certs: false
            body_format: form-urlencoded
            body:
              grant_type: refresh_token
              client_id: keelinfra-drill
              refresh_token: "{{ offline_login.json.refresh_token }}"
            status_code: 200
          register: offline_refreshed
          until: offline_refreshed.status == 200
          retries: 10
          delay: 3

        - name: Read the claims of the restored session
          ansible.builtin.set_fact:
            claims_after: >-
              {{ ((refreshed.json.access_token.split('.')[1] | replace('-', '+') | replace('_', '/'))
                  ~ ('=' * ((4 - (refreshed.json.access_token.split('.')[1] | length) % 4) % 4)))
                 | b64decode | from_json }}

        - name: The restored session must be the same session, not a fresh login
          ansible.builtin.assert:
            that:
              - claims_before.sid is defined
              - claims_after.sid is defined
              - claims_after.sid == claims_before.sid
            fail_msg: >-
              The refresh succeeded but came back on a different session id
              ({{ claims_before.sid | default('none') }} → {{ claims_after.sid | default('none') }}).
              The pre-restart session did not survive — the server issued a new one.

        - name: Session contents must survive, not just the session id
          # A refresh that returns 200 proves the session row is still there.
          # It does not prove the session still carries what it carried before,
          # which is the failure mode of the 26.7.x session-persistence bugs.
          ansible.builtin.assert:
            that:
              - claims_after.preferred_username == claims_before.preferred_username
              - (claims_after.realm_access.roles | default([]) | sort)
                == (claims_before.realm_access.roles | default([]) | sort)
              - ((claims_after.scope | default('')).split(' ') | sort)
                == ((claims_before.scope | default('')).split(' ') | sort)
            fail_msg: >-
              The session survived the restart but its contents changed —
              roles or scopes were lost on the way through the database.

        - name: Session drill result
          ansible.builtin.debug:
            msg: >-
              ✓ online and offline sessions opened before the restart both refresh after a
              full rolling restart, on the same session id, with identical roles and scopes.
              Not covered: client session notes (upstream #52038) — see UPGRADES.md.

- name: Alert drill
  hosts: monitoring
  gather_facts: false
  vars:
    am_url: "http://127.0.0.1:{{ alertmanager_port | default(9093) }}"
    receivers: >-
      {{ ((['webhook'] if alerting.webhook_url | default('') | length > 0 else [])
         + (['email'] if alerting.email is defined else []))
         if alerting is defined else [] }}
  tasks:
    - name: Run alert drill
      when: drill | default('health') in ['alert', 'all']
      block:
        - name: Skip when no receiver is configured
          ansible.builtin.debug:
            msg: >-
              No alert receiver is configured (alerting in the cluster definition), so
              alerts are only visible in Alertmanager and Grafana. Nothing to send.
          when: receivers | length == 0

        - name: Send a test alert and confirm every receiver accepted it
          when: receivers | length > 0
          vars:
            # Prints "<sent> <failed>": Alertmanager's own notification counters,
            # summed over the configured receiver integrations.
            count_cmd: >-
              curl -fsS {{ am_url }}/metrics | awk -v want="{{ receivers | join(',') }}" '
              BEGIN { n = split(want, w, ","); for (i = 1; i <= n; i++) keep[w[i]] = 1; s = 0; f = 0 }
              /^alertmanager_notifications(_failed)?_total[{]/ {
                split($0, a, "integration=\""); split(a[2], b, "\"");
                if (!(b[1] in keep)) next;
                if ($1 ~ /_failed_/) f += $NF; else s += $NF }
              END { printf "%d %d\n", s, f }'
          block:
            - name: Read notification counters before the test
              ansible.builtin.shell: "{{ count_cmd }}"  # noqa: command-instead-of-shell
              register: am_before
              changed_when: false

            - name: Post a test alert to Alertmanager
              ansible.builtin.uri:
                url: "{{ am_url }}/api/v2/alerts"
                method: POST
                body_format: json
                body:
                  - labels:
                      alertname: KeelinfraTestAlert
                      severity: info
                      instance: "{{ inventory_hostname }}"
                      drill: "{{ now(utc=true).strftime('%Y%m%dT%H%M%S') }}"
                    annotations:
                      summary: "Test alert from ./verify --drill alert. No action needed."
                status_code: 200
              changed_when: true

            # group_wait is 30 s: the first notification goes out after that.
            - name: Wait until every receiver has sent the test alert
              ansible.builtin.shell: "{{ count_cmd }}"  # noqa: command-instead-of-shell
              register: am_after
              until: >-
                (am_after.stdout.split()[0] | int)
                >= (am_before.stdout.split()[0] | int) + (receivers | length)
                or (am_after.stdout.split()[1] | int) > (am_before.stdout.split()[1] | int)
              retries: 30
              delay: 3
              changed_when: false

            - name: No notification failed
              ansible.builtin.assert:
                that: (am_after.stdout.split()[1] | int) == (am_before.stdout.split()[1] | int)
                fail_msg: "Alertmanager could not deliver the test alert. Check: journalctl -u prometheus-alertmanager"
                success_msg: "✓ test alert delivered to: {{ receivers | join(', ') }}"
