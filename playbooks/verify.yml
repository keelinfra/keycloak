---
# keelinfra/keycloak — health checks and operational drills.
# ./verify                     → health only
# ./verify --drill failover    → Patroni switchover + write test
# ./verify --drill restore     → pgBackRest restore to a scratch directory
# ./verify --drill session     → login, rolling restart, session must survive
# ./verify --drill all         → everything

- name: Health checks
  hosts: cluster
  vars:
    drill: health
  tags: [health]
  tasks:
    - name: Patroni member state
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:{{ patroni_rest_port }}/health"
        status_code: 200
      changed_when: false

    - name: Etcd endpoint health
      ansible.builtin.command:
        cmd: /usr/local/bin/etcdctl endpoint health
      changed_when: false

    - name: Keycloak readiness
      ansible.builtin.uri:
        url: "https://127.0.0.1:{{ keycloak_mgmt_port }}/health/ready"
        validate_certs: false
        status_code: 200
      changed_when: false

    - name: PostgreSQL reachable through haproxy
      become: true
      become_user: postgres
      community.postgresql.postgresql_query:
        login_host: 127.0.0.1
        port: "{{ haproxy_pg_port }}"
        login_user: "{{ keycloak_db_user }}"
        login_password: "{{ vault_keycloak_db_password }}"
        db: "{{ keycloak_db_name }}"
        query: SELECT 1
      changed_when: false

    - name: Cluster summary
      ansible.builtin.command:
        cmd: patronictl -c /etc/patroni/config.yml list
      register: patroni_list
      changed_when: false
      run_once: true

    - name: Show cluster
      ansible.builtin.debug:
        msg: "{{ patroni_list.stdout_lines }}"
      run_once: true

- name: Failover drill
  hosts: primary
  gather_facts: false
  tasks:
    - name: Run failover drill
      when: drill | default('health') in ['failover', 'all']
      block:
        - name: Find current leader
          ansible.builtin.command:
            cmd: patronictl -c /etc/patroni/config.yml list -f json
          register: cluster_state
          changed_when: false

        - name: Pick leader and a healthy replica
          ansible.builtin.set_fact:
            current_leader: >-
              {{ (cluster_state.stdout | from_json)
                 | selectattr('Role', 'equalto', 'Leader')
                 | map(attribute='Member') | first }}
            switch_target: >-
              {{ (cluster_state.stdout | from_json)
                 | selectattr('Role', 'equalto', 'Replica')
                 | selectattr('State', 'equalto', 'streaming')
                 | map(attribute='Member') | first }}

        - name: Switch the PostgreSQL leader over to a replica
          ansible.builtin.command:
            cmd: patronictl -c /etc/patroni/config.yml switchover --leader {{ current_leader }} --candidate {{ switch_target }} --force
          changed_when: true

        - name: Write through haproxy after switchover
          become: true
          become_user: postgres
          community.postgresql.postgresql_query:
            login_host: 127.0.0.1
            port: "{{ haproxy_pg_port }}"
            login_user: "{{ keycloak_db_user }}"
            login_password: "{{ vault_keycloak_db_password }}"
            db: "{{ keycloak_db_name }}"
            query: "CREATE TABLE IF NOT EXISTS keelinfra_drill (at timestamptz); INSERT INTO keelinfra_drill VALUES (now())"
          register: write_test
          retries: 10
          delay: 3
          until: write_test is succeeded
          changed_when: true

        - name: Failover drill passed
          ansible.builtin.debug:
            msg: "✓ switchover {{ current_leader }} → {{ switch_target }} complete, writes OK through haproxy"

- name: Restore drill
  hosts: backup_repo
  gather_facts: false
  tasks:
    - name: Run restore drill
      when: drill | default('health') in ['restore', 'all']
      block:
        - name: Clean scratch restore directory
          ansible.builtin.file:
            path: /var/tmp/keelinfra-restore-drill
            state: absent

        - name: Restore latest backup to scratch directory
          become: true
          become_user: postgres
          ansible.builtin.command:
            cmd: >-
              pgbackrest --stanza=main restore
              --pg1-path=/var/tmp/keelinfra-restore-drill
              --type=none
          changed_when: true

        - name: Verify restored cluster files
          ansible.builtin.stat:
            path: /var/tmp/keelinfra-restore-drill/PG_VERSION
          register: restored

        - name: Restore drill result
          ansible.builtin.assert:
            that: restored.stat.exists
            success_msg: "✓ restore to scratch directory OK"
            fail_msg: "restore completed but PG_VERSION missing"

        - name: Clean up scratch directory
          ansible.builtin.file:
            path: /var/tmp/keelinfra-restore-drill
            state: absent

- name: Session survival drill
  hosts: primary
  gather_facts: false
  vars:
    kc_token_url: "https://127.0.0.1:{{ keycloak_https_port }}/realms/demo/protocol/openid-connect/token"
  tasks:
    - name: Run session drill
      when: drill | default('health') in ['session', 'all']
      block:
        - name: Open an online session on the demo realm (password grant)
          ansible.builtin.uri:
            url: "{{ kc_token_url }}"
            method: POST
            validate_certs: false
            body_format: form-urlencoded
            body:
              grant_type: password
              client_id: keelinfra-drill
              username: demo
              password: demo12345
              scope: openid
            status_code: 200
          register: login

        - name: Open an offline session as well
          # Offline sessions persist through OFFLINE_USER_SESSION /
          # OFFLINE_CLIENT_SESSION — a different code path from online ones,
          # and the one upstream #51920 reported write conflicts on.
          ansible.builtin.uri:
            url: "{{ kc_token_url }}"
            method: POST
            validate_certs: false
            body_format: form-urlencoded
            body:
              grant_type: password
              client_id: keelinfra-drill
              username: demo
              password: demo12345
              scope: openid offline_access
            status_code: 200
          register: offline_login

        - name: Read the claims of the pre-restart session
          ansible.builtin.set_fact:
            claims_before: >-
              {{ ((login.json.access_token.split('.')[1] | replace('-', '+') | replace('_', '/'))
                  ~ ('=' * ((4 - (login.json.access_token.split('.')[1] | length) % 4) % 4)))
                 | b64decode | from_json }}

        - name: Rolling restart of every Keycloak node
          ansible.builtin.systemd:
            name: keycloak
            state: restarted
          delegate_to: "{{ item }}"
          loop: "{{ groups['keycloak'] }}"

        - name: Wait for all nodes ready again
          ansible.builtin.uri:
            url: "https://{{ hostvars[item].ansible_host }}:{{ keycloak_mgmt_port }}/health/ready"
            validate_certs: false
            status_code: 200
          register: ready
          until: ready.status == 200
          retries: 60
          delay: 5
          loop: "{{ groups['keycloak'] }}"

        - name: Refresh the pre-restart online session
          ansible.builtin.uri:
            url: "{{ kc_token_url }}"
            method: POST
            validate_certs: false
            body_format: form-urlencoded
            body:
              grant_type: refresh_token
              client_id: keelinfra-drill
              refresh_token: "{{ login.json.refresh_token }}"
            status_code: 200
          register: refreshed

        - name: Refresh the pre-restart offline session
          ansible.builtin.uri:
            url: "{{ kc_token_url }}"
            method: POST
            validate_certs: false
            body_format: form-urlencoded
            body:
              grant_type: refresh_token
              client_id: keelinfra-drill
              refresh_token: "{{ offline_login.json.refresh_token }}"
            status_code: 200
          register: offline_refreshed

        - name: Read the claims of the restored session
          ansible.builtin.set_fact:
            claims_after: >-
              {{ ((refreshed.json.access_token.split('.')[1] | replace('-', '+') | replace('_', '/'))
                  ~ ('=' * ((4 - (refreshed.json.access_token.split('.')[1] | length) % 4) % 4)))
                 | b64decode | from_json }}

        - name: The restored session must be the same session, not a fresh login
          ansible.builtin.assert:
            that:
              - claims_before.sid is defined
              - claims_after.sid is defined
              - claims_after.sid == claims_before.sid
            fail_msg: >-
              The refresh succeeded but came back on a different session id
              ({{ claims_before.sid | default('none') }} → {{ claims_after.sid | default('none') }}).
              The pre-restart session did not survive — the server issued a new one.

        - name: Session contents must survive, not just the session id
          # A refresh that returns 200 proves the session row is still there.
          # It does not prove the session still carries what it carried before,
          # which is the failure mode of the 26.7.x session-persistence bugs.
          ansible.builtin.assert:
            that:
              - claims_after.preferred_username == claims_before.preferred_username
              - (claims_after.realm_access.roles | default([]) | sort)
                == (claims_before.realm_access.roles | default([]) | sort)
              - ((claims_after.scope | default('')).split(' ') | sort)
                == ((claims_before.scope | default('')).split(' ') | sort)
            fail_msg: >-
              The session survived the restart but its contents changed —
              roles or scopes were lost on the way through the database.

        - name: Session drill result
          ansible.builtin.debug:
            msg: >-
              ✓ online and offline sessions opened before the restart both refresh after a
              full rolling restart, on the same session id, with identical roles and scopes.
              Not covered: client session notes (upstream #52038) — see UPGRADES.md.
