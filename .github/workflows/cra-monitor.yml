---
name: cra monitor
# Every release still inside its support period (its cra-evidence.json says
# until when) is checked daily against OSV. A vulnerability that CISA KEV or
# ENISA's EUVD lists as actively exploited fails the run and opens an issue
# labelled "cra" with the EU CRA Article 14 reporting checklist. See CRA.md.

on:
  schedule:
    - cron: "31 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: keelinfra/release-ledger/monitor@957a6bb6a5124e9d69511678191e93e080640dfa  # main, 2026-10-23
