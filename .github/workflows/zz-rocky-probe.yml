---
name: zz-rocky-probe
# temporary: package facts for Rocky 9, removed before review
on:
  push:
    branches: [claude/project-thread-9trpve]
    paths: [.github/workflows/zz-rocky-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: probe
        run: |
          cat > /tmp/p.sh <<'SH'
          set -x
          head -3 /etc/os-release
          rpm -qa | sort | tr '\n' ' '; echo
          K=https://download.postgresql.org/pub/repos/yum/keys/PGDG-RPM-GPG-KEY-RHEL
          B=https://download.postgresql.org/pub/repos/yum
          printf '%s\n' "[pgdg17]" "name=pgdg17" "baseurl=$B/17/redhat/rhel-9-\$basearch" "gpgcheck=1" "gpgkey=$K" \
            "[pgdg-common]" "name=pgdg-common" "baseurl=$B/common/redhat/rhel-9-\$basearch" "gpgcheck=1" "gpgkey=$K" \
            "[pgdg-extras]" "name=pgdg-extras" "baseurl=$B/common/pgdg-rhel9-extras/redhat/rhel-9-\$basearch" "gpgcheck=1" "gpgkey=$K" "skip_if_unavailable=1" \
            "[grafana]" "name=grafana" "baseurl=https://rpm.grafana.com" "gpgcheck=1" "gpgkey=https://rpm.grafana.com/gpg.key" \
            > /etc/yum.repos.d/probe.repo
          dnf -q makecache
          curl -s https://download.postgresql.org/pub/repos/yum/common/ | grep -o 'href="[^"]*"' | head -40
          curl -s https://download.postgresql.org/pub/repos/yum/common/redhat/ | grep -o 'href="[^"]*"' | head
          dnf -q repoquery --qf "%{name}-%{version} %{repoid}" patroni patroni-etcd python3-etcd pgbackrest python3-ydiff
          dnf -y -q install epel-release
          dnf -y install --setopt=install_weak_deps=False postgresql17-server patroni patroni-etcd pgbackrest haproxy keepalived socat java-21-openjdk-headless python3-psycopg2 python3-cryptography chrony acl gnupg2 cronie tar grafana policycoreutils-python-utils python3-libselinux 2>&1 | tail -60
          rpm -q patroni patroni-etcd pgbackrest postgresql17-server grafana haproxy
          for p in patroni postgresql17-server haproxy keepalived pgbackrest; do echo "--- $p"; rpm -ql $p | grep -E 'systemd|tmpfiles|/usr/bin/[a-z]' | head; done
          cat /usr/lib/systemd/system/patroni.service
          cat /usr/lib/systemd/system/haproxy.service
          getent passwd postgres haproxy
          ls -la /usr/lib/jvm/
          ls -d /run/postgresql /var/run/postgresql
          cat /usr/lib/tmpfiles.d/*postgres*
          ls /var/lib/pgsql /var/lib/pgsql/17
          /usr/pgsql-17/bin/postgres --version
          patroni --version; pgbackrest version; haproxy -v | head -1
          python3 -c 'import etcd' && echo python-etcd ok
          grep -n "^ExecStart\|^User" /usr/lib/systemd/system/grafana-server.service
          ls -d /etc/pgbackrest*; rpm -ql pgbackrest | grep -E '^/etc|^/var'
          SH
          docker run --rm -v /tmp/p.sh:/p.sh rockylinux/rockylinux:9 bash /p.sh
