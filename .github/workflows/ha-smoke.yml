---
name: ha-smoke
# 3-node install on the container rig (dev/containers): three privileged
# Ubuntu 24.04 systemd containers on the runner, Ansible reaching them over
# ssh from a fourth. Proves the roles converge on three nodes — etcd quorum,
# a Patroni leader with two streaming replicas, the pgBackRest ssh mesh,
# certificate distribution, Infinispan clustering — and that a login survives
# a rolling restart. The single-node smoke on the VM runner remains the guard
# for what the roles need from a real machine. A second job runs the same
# on Rocky Linux 9 and AlmaLinux 9 nodes.
on:
  push:
    branches: [main]
    paths:
      - roles/**
      - playbooks/**
      - dev/containers/**
      - dev/ha-*.sh
      - dev/restore-check.yml
      - dev/rebuild-check.yml
      - try
      - .github/workflows/ha-smoke.yml
  pull_request:
    paths:
      - roles/**
      - playbooks/**
      - dev/containers/**
      - dev/ha-*.sh
      - dev/restore-check.yml
      - dev/rebuild-check.yml
      - try
      - .github/workflows/ha-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ha-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  three-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # A docker-container builder (needed for cache export) and the Actions
      # cache endpoint for BuildKit's type=gha cache.
      - uses: docker/setup-buildx-action@v4
      - uses: crazy-max/ghaction-github-runtime@v4

      # Built here, loaded into the runner's daemon, layers cached in the
      # Actions cache. Never pushed anywhere. Run from the compose file's
      # directory so the relative build context resolves the same way as
      # for `docker compose build`; bake wants an explicit entitlement to
      # read a context outside that directory.
      - name: Build rig images
        working-directory: dev/containers
        run: |
          docker buildx bake -f compose.yml --load --allow "fs.read=$(cd ../.. && pwd)" \
            --set '*.cache-from=type=gha' --set '*.cache-to=type=gha,mode=max'

      # Through ./try, the one command a first-time visitor runs: up,
      # configure and install, Keycloak published on localhost:8443.
      - name: Start the rig and install with ./try
        env:
          HA_SKIP_BUILD: "1"
        run: ./try | tee "$RUNNER_TEMP/try.txt"

      - name: Log in from this machine with what ./try printed
        run: |
          password=$(sed -n 's/^ *Password: *//p' "$RUNNER_TEMP/try.txt")
          test -n "$password"
          issuer=$(curl -fsSk https://localhost:8443/realms/master/.well-known/openid-configuration | jq -r .issuer)
          test "$issuer" = https://localhost:8443/realms/master
          curl -fsSk https://localhost:8443/realms/master/protocol/openid-connect/token \
            -d grant_type=password -d client_id=admin-cli -d username=admin \
            --data-urlencode "password=$password" | jq -e .access_token > /dev/null
          curl -fsSk -o /dev/null https://localhost:8443/admin/master/console/

      - name: Health checks
        run: dev/ha-exec.sh ./verify

      - name: Drills — failover, restore from both repositories, session across a rolling restart, test alert
        run: dev/ha-exec.sh ./verify --drill all

      - name: Renew every certificate on the running cluster, then check again
        run: |
          dev/ha-exec.sh ./renew-certs
          dev/ha-exec.sh ./verify

      - name: Restore the database to a point in time, then check the data and the cluster
        run: |
          dev/ha-exec.sh env ANSIBLE_VAULT_PASSWORD_FILE=/work/inventory/.vault_pass \
            ansible-playbook dev/restore-check.yml -e phase=before
          # shellcheck disable=SC2016 # $(...) runs inside the container, not here
          dev/ha-exec.sh bash -c './restore --yes --time "$(cat /tmp/keelinfra-restore-time)"'
          dev/ha-exec.sh env ANSIBLE_VAULT_PASSWORD_FILE=/work/inventory/.vault_pass \
            ansible-playbook dev/restore-check.yml -e phase=after
          dev/ha-exec.sh ./verify

      - name: Lose a node, put a fresh machine in its place, then check the cluster
        run: |
          dev/ha-wipe-node.sh kc-node3
          dev/ha-exec.sh ./replace-node kc-node3 --yes
          dev/ha-exec.sh ./verify

      - name: Lose the first node (CAs, backup repository 1, monitoring), replace it, then check the cluster
        run: |
          dev/ha-wipe-node.sh kc-node1
          dev/ha-exec.sh ./replace-node kc-node1 --yes
          dev/ha-exec.sh ./verify

      - name: Lose every node, rebuild the cluster from the off-site backup, then check the data and the cluster
        run: |
          dev/ha-exec.sh env ANSIBLE_VAULT_PASSWORD_FILE=/work/inventory/.vault_pass \
            ansible-playbook dev/rebuild-check.yml -e phase=before
          for n in kc-node1 kc-node2 kc-node3; do dev/ha-wipe-node.sh "$n"; done
          dev/ha-exec.sh ./rebuild --yes
          dev/ha-exec.sh env ANSIBLE_VAULT_PASSWORD_FILE=/work/inventory/.vault_pass \
            ansible-playbook dev/rebuild-check.yml -e phase=after
          dev/ha-exec.sh ./verify

      - name: Resource use
        if: always()
        run: |
          docker stats --no-stream
          df -h /

      - name: Collect node logs
        if: always()
        timeout-minutes: 5
        run: dev/ha-logs.sh .dev/containers/artifacts

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ha-smoke-logs
          path: .dev/containers/artifacts
          retention-days: 14
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: dev/ha-down.sh

  # The same on Rocky Linux 9 and AlmaLinux 9 nodes: PGDG and EPEL
  # packages, upstream Prometheus binaries, the RHEL-family paths. Containers
  # run without SELinux; vm.yml covers an enforcing Rocky host.
  three-node-el9:
    name: three-node-${{ matrix.os }}
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: rocky9
            node_target: node-rocky9
          - os: alma9
            node_target: node-alma9
    env:
      HA_OS: ${{ matrix.os }}
      HA_NODE_TARGET: ${{ matrix.node_target }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4
      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Build rig images
        working-directory: dev/containers
        run: |
          docker buildx bake -f compose.yml --load --allow "fs.read=$(cd ../.. && pwd)" \
            --set '*.cache-from=type=gha' --set '*.cache-to=type=gha,mode=max'

      - name: Start the rig and configure
        run: dev/ha-up.sh --no-build --os "$HA_OS"

      - name: Install
        run: dev/ha-exec.sh ./install

      - name: Health checks
        run: dev/ha-exec.sh ./verify

      - name: Drills — failover, restore from both repositories, session across a rolling restart, test alert
        run: dev/ha-exec.sh ./verify --drill all

      - name: Run install a second time
        run: dev/ha-exec.sh ./install

      - name: Renew every certificate on the running cluster, then check again
        run: |
          dev/ha-exec.sh ./renew-certs
          dev/ha-exec.sh ./verify

      - name: Restore the database to a point in time, then check the data and the cluster
        run: |
          dev/ha-exec.sh env ANSIBLE_VAULT_PASSWORD_FILE=/work/inventory/.vault_pass \
            ansible-playbook dev/restore-check.yml -e phase=before
          # shellcheck disable=SC2016 # $(...) runs inside the container, not here
          dev/ha-exec.sh bash -c './restore --yes --time "$(cat /tmp/keelinfra-restore-time)"'
          dev/ha-exec.sh env ANSIBLE_VAULT_PASSWORD_FILE=/work/inventory/.vault_pass \
            ansible-playbook dev/restore-check.yml -e phase=after
          dev/ha-exec.sh ./verify

      - name: Lose a node, put a fresh machine in its place, then check the cluster
        run: |
          dev/ha-wipe-node.sh kc-node3
          dev/ha-exec.sh ./replace-node kc-node3 --yes
          dev/ha-exec.sh ./verify

      - name: Lose the first node (CAs, backup repository 1, monitoring), replace it, then check the cluster
        run: |
          dev/ha-wipe-node.sh kc-node1
          dev/ha-exec.sh ./replace-node kc-node1 --yes
          dev/ha-exec.sh ./verify

      - name: Lose every node, rebuild the cluster from the off-site backup, then check the data and the cluster
        run: |
          dev/ha-exec.sh env ANSIBLE_VAULT_PASSWORD_FILE=/work/inventory/.vault_pass \
            ansible-playbook dev/rebuild-check.yml -e phase=before
          for n in kc-node1 kc-node2 kc-node3; do dev/ha-wipe-node.sh "$n"; done
          dev/ha-exec.sh ./rebuild --yes
          dev/ha-exec.sh env ANSIBLE_VAULT_PASSWORD_FILE=/work/inventory/.vault_pass \
            ansible-playbook dev/rebuild-check.yml -e phase=after
          dev/ha-exec.sh ./verify

      - name: Collect node logs
        if: always()
        timeout-minutes: 5
        run: dev/ha-logs.sh .dev/containers/artifacts

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ha-smoke-${{ matrix.os }}-logs
          path: .dev/containers/artifacts
          retention-days: 14
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: dev/ha-down.sh
