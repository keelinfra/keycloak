---
name: ha-smoke
# 3-node install on the container rig (dev/containers): three privileged
# Ubuntu 24.04 systemd containers on the runner, Ansible reaching them over
# ssh from a fourth. Proves the roles converge on three nodes — etcd quorum,
# a Patroni leader with two streaming replicas, the pgBackRest ssh mesh,
# certificate distribution, Infinispan clustering — and that a login survives
# a rolling restart. The single-node smoke on the VM runner remains the guard
# for what the roles need from a real machine. A second job runs the same
# on Rocky Linux 9 and AlmaLinux 9 nodes.
on:
  push:
    branches: [main]
    paths:
      - roles/**
      - playbooks/**
      - dev/containers/**
      - dev/ha-*.sh
      - dev/restore-check.yml
      - dev/rebuild-check.yml
      - try
      - .github/workflows/ha-smoke.yml
  pull_request:
    paths:
      - roles/**
      - playbooks/**
      - dev/containers/**
      - dev/ha-*.sh
      - dev/restore-check.yml
      - dev/rebuild-check.yml
      - try
      - .github/workflows/ha-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ha-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  three-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # A docker-container builder (needed for cache export) and the Actions
      # cache endpoint for BuildKit's type=gha cache.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          # The Actions cache endpoint and token, for BuildKit's type=gha cache.
          script: |
            for (const [k, v] of Object.entries(process.env)) {
              if (k.startsWith("ACTIONS_")) core.exportVariable(k, v);
            }

      # Built here, loaded into the runner's daemon, layers cached in the
      # Actions cache. Never pushed anywhere. Run from the compose file's
      # directory so the relative build context resolves the same way as
      # for `docker compose build`; bake wants an explicit entitlement to
      # read a context outside that directory.
      - name: Build rig images
        working-directory: dev/containers
        run: |
          docker buildx bake -f compose.yml --load --allow "fs.read=$(cd ../.. && pwd)" \
            --set '*.cache-from=type=gha' --set '*.cache-to=type=gha,mode=max'

      # Through ./try, the one command a first-time visitor runs: up,
      # configure and install, Keycloak published on localhost:8443.
      - name: Start the rig and install with ./try
        env:
          HA_SKIP_BUILD: "1"
        run: |
          set -o pipefail
          ./try | tee "$RUNNER_TEMP/try.txt"

      - name: Log in from this machine with what ./try printed
        run: |
          password=$(sed -n 's/^ *Password: *//p' "$RUNNER_TEMP/try.txt")
          test -n "$password"
          issuer=$(curl -fsSk https://localhost:8443/realms/master/.well-known/openid-configuration | jq -r .issuer)
          test "$issuer" = https://localhost:8443/realms/master
          curl -fsSk https://localhost:8443/realms/master/protocol/openid-connect/token \
            -d grant_type=password -d client_id=admin-cli -d username=admin \
            --data-urlencode "password=$password" | jq -e .access_token > /dev/null
          curl -fsSk -o /dev/null https://localhost:8443/admin/master/console/

      # Plain ./verify on this machine: it hands itself to the control
      # container, as it must on macOS, where the nodes are out of reach.
      - name: Health checks
        run: ./verify

      # What ./try promises: the console keeps working with a node down, and
      # the node catches up by itself when it comes back, even once the leader
      # has recycled the WAL it missed: it fetches that from the backup
      # archive. Patroni holds a gone node's replication slot, and so its WAL,
      # for 30 minutes; member_slots_ttl=0 stands in for a longer outage.
      - name: Stop a replica until the leader recycles its WAL, then start it again
        run: |
          leader=$(docker exec kc-node1 patronictl -c /etc/patroni/config.yml list -f json \
            | jq -r '.[] | select(.Role == "Leader") | .Member')
          # Not kc-node1: its load balancer is the one published on localhost.
          node=$(docker exec kc-node1 patronictl -c /etc/patroni/config.yml list -f json \
            | jq -r '[.[] | select(.Role != "Leader" and .Member != "kc-node1")][0].Member')
          ctl() { docker exec "$leader" patronictl -c /etc/patroni/config.yml "$@"; }
          sql() { docker exec -u postgres -w /tmp "$leader" psql -h /var/run/postgresql -d postgres -Atc "$1"; }
          slot=${node//-/_}
          echo "leader $leader, stopping $node"

          ctl edit-config --force -s member_slots_ttl=0
          sql "CREATE TABLE IF NOT EXISTS ci_wal (x int)"
          docker stop "$node"
          need=$(sql "SELECT pg_walfile_name(restart_lsn) FROM pg_replication_slots WHERE slot_name = '$slot'")
          test -n "$need"
          curl -fsSk -o /dev/null --retry 10 --retry-all-errors --retry-delay 3 \
            https://localhost:8443/admin/master/console/

          for _ in $(seq 30); do
            [ "$(sql "SELECT count(*) FROM pg_replication_slots WHERE slot_name = '$slot'")" = 0 ] && break
            sleep 5
          done
          for _ in $(seq 16); do
            sql "INSERT INTO ci_wal VALUES (1)" > /dev/null
            sql "SELECT pg_switch_wal()" > /dev/null
          done
          sleep 10   # let archive_command take the last segments
          sql "CHECKPOINT"
          gone=$(sql "SELECT count(*) = 0 FROM pg_ls_waldir() WHERE name = '$need'")
          echo "$node needs $need from the leader; removed there: $gone"
          test "$gone" = t
          ctl edit-config --force -s member_slots_ttl=null

          # ./verify waits up to two minutes for replicas to stream; the loop
          # covers Keycloak starting on the node.
          docker start "$node"
          for _ in $(seq 8); do
            ./verify > /dev/null 2>&1 && break
            sleep 10
          done
          ./verify
          sql "DROP TABLE ci_wal"

      - name: Drills — failover, restore from both repositories, session across a rolling restart, test alert
        run: dev/ha-exec.sh ./verify --drill all

      - name: Freeze the PostgreSQL leader mid-write; no acknowledged write may be lost
        run: |
          set -o pipefail
          dev/ha-exec.sh ./verify --drill crash | tee "$RUNNER_TEMP/crash.txt"
          grep -o '✓ .* frozen mid-write.*' "$RUNNER_TEMP/crash.txt" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Renew every certificate on the running cluster, then check again
        run: |
          dev/ha-exec.sh ./renew-certs
          dev/ha-exec.sh ./verify

      - name: Trust a distrusted root CA again on every node, then remove it with ./update-trust
        run: |
          # As on a node whose JDK store missed a removal: ./verify must name
          # the root, ./update-trust must rebuild the store and restart Keycloak.
          for n in kc-node1 kc-node2 kc-node3; do
            docker exec -i "$n" sh -c 'if [ -d /etc/pki/ca-trust ]; then
                k=/usr/lib/jvm/jre-21-openjdk/bin/keytool s=/etc/pki/ca-trust/extracted/java/cacerts
              else
                k=/usr/lib/jvm/java-21-openjdk-amd64/bin/keytool s=/etc/ssl/certs/java/cacerts
              fi
              "$k" -importcert -noprompt -alias ci-distrusted -keystore "$s" -storepass changeit' \
              < roles/common/files/distrust/emSign_ECC_Root_CA_-_G3.pem
          done
          if dev/ha-exec.sh ./verify > "$RUNNER_TEMP/verify-distrusted.txt" 2>&1; then
            echo "./verify passed with a distrusted root in the JDK's trust store" >&2
            exit 1
          fi
          grep "still trusts emSign ECC Root CA - G3" "$RUNNER_TEMP/verify-distrusted.txt"
          dev/ha-exec.sh ./update-trust
          dev/ha-exec.sh ./verify

      - name: Restore the database to a point in time, then check the data and the cluster
        run: |
          dev/ha-exec.sh env ANSIBLE_VAULT_PASSWORD_FILE=/work/inventory/.vault_pass \
            ansible-playbook dev/restore-check.yml -e phase=before
          # shellcheck disable=SC2016 # $(...) runs inside the container, not here
          dev/ha-exec.sh bash -c './restore --yes --time "$(cat /tmp/keelinfra-restore-time)"'
          dev/ha-exec.sh env ANSIBLE_VAULT_PASSWORD_FILE=/work/inventory/.vault_pass \
            ansible-playbook dev/restore-check.yml -e phase=after
          dev/ha-exec.sh ./verify

      - name: Lose a node, put a fresh machine in its place, then check the cluster
        run: |
          dev/ha-wipe-node.sh kc-node3
          dev/ha-exec.sh ./replace-node kc-node3 --yes
          dev/ha-exec.sh ./verify

      - name: Lose the first node (CAs, backup repository 1, monitoring), replace it, then check the cluster
        run: |
          dev/ha-wipe-node.sh kc-node1
          # Alerting outlives the first node: the second one sends the alert.
          dev/ha-wait-alert.sh KeycloakDown kc-node1
          dev/ha-exec.sh ./replace-node kc-node1 --yes
          dev/ha-exec.sh ./verify

      - name: Lose every node, rebuild the cluster from the off-site backup, then check the data and the cluster
        run: |
          dev/ha-exec.sh env ANSIBLE_VAULT_PASSWORD_FILE=/work/inventory/.vault_pass \
            ansible-playbook dev/rebuild-check.yml -e phase=before
          for n in kc-node1 kc-node2 kc-node3; do dev/ha-wipe-node.sh "$n"; done
          dev/ha-exec.sh ./rebuild --yes
          dev/ha-exec.sh env ANSIBLE_VAULT_PASSWORD_FILE=/work/inventory/.vault_pass \
            ansible-playbook dev/rebuild-check.yml -e phase=after
          dev/ha-exec.sh ./verify

      - name: Resource use
        if: always()
        run: |
          docker stats --no-stream
          df -h /

      - name: Collect node logs
        if: always()
        timeout-minutes: 5
        run: dev/ha-logs.sh .dev/containers/artifacts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: ha-smoke-logs
          path: .dev/containers/artifacts
          retention-days: 14
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: dev/ha-down.sh

  # The same on Rocky Linux 9 and AlmaLinux 9 nodes: PGDG and EPEL
  # packages, upstream Prometheus binaries, the RHEL-family paths. Containers
  # run without SELinux; vm.yml covers an enforcing Rocky host.
  three-node-el9:
    name: three-node-${{ matrix.os }}
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: rocky9
            node_target: node-rocky9
          - os: alma9
            node_target: node-alma9
    env:
      HA_OS: ${{ matrix.os }}
      HA_NODE_TARGET: ${{ matrix.node_target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          # The Actions cache endpoint and token, for BuildKit's type=gha cache.
          script: |
            for (const [k, v] of Object.entries(process.env)) {
              if (k.startsWith("ACTIONS_")) core.exportVariable(k, v);
            }

      - name: Build rig images
        working-directory: dev/containers
        run: |
          docker buildx bake -f compose.yml --load --allow "fs.read=$(cd ../.. && pwd)" \
            --set '*.cache-from=type=gha' --set '*.cache-to=type=gha,mode=max'

      - name: Start the rig and configure
        run: dev/ha-up.sh --no-build --os "$HA_OS"

      - name: Install
        run: dev/ha-exec.sh ./install

      - name: Health checks
        run: dev/ha-exec.sh ./verify

      - name: Drills — failover, restore from both repositories, session across a rolling restart, test alert
        run: dev/ha-exec.sh ./verify --drill all

      - name: Freeze the PostgreSQL leader mid-write; no acknowledged write may be lost
        run: |
          set -o pipefail
          dev/ha-exec.sh ./verify --drill crash | tee "$RUNNER_TEMP/crash.txt"
          grep -o '✓ .* frozen mid-write.*' "$RUNNER_TEMP/crash.txt" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Run install a second time
        run: dev/ha-exec.sh ./install

      - name: Renew every certificate on the running cluster, then check again
        run: |
          dev/ha-exec.sh ./renew-certs
          dev/ha-exec.sh ./verify

      - name: Trust a distrusted root CA again on every node, then remove it with ./update-trust
        run: |
          # As on a node whose JDK store missed a removal: ./verify must name
          # the root, ./update-trust must rebuild the store and restart Keycloak.
          for n in kc-node1 kc-node2 kc-node3; do
            docker exec -i "$n" sh -c 'if [ -d /etc/pki/ca-trust ]; then
                k=/usr/lib/jvm/jre-21-openjdk/bin/keytool s=/etc/pki/ca-trust/extracted/java/cacerts
              else
                k=/usr/lib/jvm/java-21-openjdk-amd64/bin/keytool s=/etc/ssl/certs/java/cacerts
              fi
              "$k" -importcert -noprompt -alias ci-distrusted -keystore "$s" -storepass changeit' \
              < roles/common/files/distrust/emSign_ECC_Root_CA_-_G3.pem
          done
          if dev/ha-exec.sh ./verify > "$RUNNER_TEMP/verify-distrusted.txt" 2>&1; then
            echo "./verify passed with a distrusted root in the JDK's trust store" >&2
            exit 1
          fi
          grep "still trusts emSign ECC Root CA - G3" "$RUNNER_TEMP/verify-distrusted.txt"
          dev/ha-exec.sh ./update-trust
          dev/ha-exec.sh ./verify

      - name: Restore the database to a point in time, then check the data and the cluster
        run: |
          dev/ha-exec.sh env ANSIBLE_VAULT_PASSWORD_FILE=/work/inventory/.vault_pass \
            ansible-playbook dev/restore-check.yml -e phase=before
          # shellcheck disable=SC2016 # $(...) runs inside the container, not here
          dev/ha-exec.sh bash -c './restore --yes --time "$(cat /tmp/keelinfra-restore-time)"'
          dev/ha-exec.sh env ANSIBLE_VAULT_PASSWORD_FILE=/work/inventory/.vault_pass \
            ansible-playbook dev/restore-check.yml -e phase=after
          dev/ha-exec.sh ./verify

      - name: Lose a node, put a fresh machine in its place, then check the cluster
        run: |
          dev/ha-wipe-node.sh kc-node3
          dev/ha-exec.sh ./replace-node kc-node3 --yes
          dev/ha-exec.sh ./verify

      - name: Lose the first node (CAs, backup repository 1, monitoring), replace it, then check the cluster
        run: |
          dev/ha-wipe-node.sh kc-node1
          # Alerting outlives the first node: the second one sends the alert.
          dev/ha-wait-alert.sh KeycloakDown kc-node1
          dev/ha-exec.sh ./replace-node kc-node1 --yes
          dev/ha-exec.sh ./verify

      - name: Lose every node, rebuild the cluster from the off-site backup, then check the data and the cluster
        run: |
          dev/ha-exec.sh env ANSIBLE_VAULT_PASSWORD_FILE=/work/inventory/.vault_pass \
            ansible-playbook dev/rebuild-check.yml -e phase=before
          for n in kc-node1 kc-node2 kc-node3; do dev/ha-wipe-node.sh "$n"; done
          dev/ha-exec.sh ./rebuild --yes
          dev/ha-exec.sh env ANSIBLE_VAULT_PASSWORD_FILE=/work/inventory/.vault_pass \
            ansible-playbook dev/rebuild-check.yml -e phase=after
          dev/ha-exec.sh ./verify

      - name: Collect node logs
        if: always()
        timeout-minutes: 5
        run: dev/ha-logs.sh .dev/containers/artifacts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: ha-smoke-${{ matrix.os }}-logs
          path: .dev/containers/artifacts
          retention-days: 14
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: dev/ha-down.sh
