---
name: upgrade matrix
# Executes every upgrade path listed in UPGRADES.md, end-to-end, on a clean
# single-node install: install the FROM version, log in, run ./upgrade, then
# prove the pre-upgrade session still refreshes on the TO version.
# This is the single-node run of each path; whether a path has also been
# drilled on 3 nodes is recorded per row in UPGRADES.md.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - playbooks/upgrade.yml
      - roles/keycloak/**
      - .github/workflows/upgrade-matrix.yml

permissions:
  contents: read

jobs:
  upgrade:
    name: "${{ matrix.from }} → ${{ matrix.to }} (${{ matrix.strategy }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # One row per path in UPGRADES.md. A new path runs here first and is
      # only listed as supported after it has passed.
      # dist_url (optional) installs the TO version from a non-upstream
      # tarball — used for KeelInfra LTS builds of upstream maintenance tags
      # that have no community artifacts (kc-*-keel* releases in this repo).
      # from_dist_url (optional) does the same for the FROM version, for paths
      # that start on one of those builds.
      matrix:
        include:
          - { from: "26.6.0", to: "26.6.2", strategy: rolling }
          # 26.7.5 (2026-09-30) is the last community release on the 26.7
          # branch: 26.8.0 shipped the next day and upstream supports one
          # release at a time. These rows target it instead of 26.7.3.
          - { from: "26.6.2", to: "26.7.5", strategy: stop-start }
          # 26.7.0/26.7.1/26.7.2 carry known regressions fixed in 26.7.3
          # (sustained high CPU, super-linear admin API cost, offline client
          # session write conflicts) — this row is the way off them.
          - { from: "26.7.0", to: "26.7.5", strategy: rolling }
          # 26.7.3 was this distribution's default install from 2026-08-31 to
          # 2026-10-01: the patch path to 26.7.5, and the minor paths onto
          # 26.8, where the next patches land.
          - { from: "26.7.3", to: "26.7.5", strategy: rolling }
          - { from: "26.7.3", to: "26.8.0", strategy: stop-start }
          - { from: "26.7.5", to: "26.8.0", strategy: stop-start }
          - from: "26.2.5"
            to: "26.2.16"
            strategy: rolling
            dist_url: "https://github.com/keelinfra/keycloak/releases/download/kc-26.2.16-keel1/keycloak-26.2.16.tar.gz"
          # 26.6 became a second RHBK-only stream: community artifacts stop at
          # 26.6.4, while 26.6.5, 26.6.6 and 26.6.7 exist as tags only; all
          # three are built here. 26.6.6 carries 12 CVE fixes over 26.6.4.
          - from: "26.6.4"
            to: "26.6.6"
            strategy: rolling
            dist_url: "https://github.com/keelinfra/keycloak/releases/download/kc-26.6.6-keel1/keycloak-26.6.6.tar.gz"
          # 26.6.7 (tagged 2026-09-07, built as kc-26.6.7-keel1 on 2026-10-01)
          # is the branch head: the rolling hop from the previous build.
          - from: "26.6.6"
            to: "26.6.7"
            strategy: rolling
            from_dist_url: "https://github.com/keelinfra/keycloak/releases/download/kc-26.6.6-keel1/keycloak-26.6.6.tar.gz"
            dist_url: "https://github.com/keelinfra/keycloak/releases/download/kc-26.6.7-keel1/keycloak-26.6.7.tar.gz"
          # The way off the 26.6 LTS builds: start on a kc-26.6.*-keel1 build
          # (no upstream artifact, hence from_dist_url) and move to the last
          # community 26.7 release. 26.8.0 is the next hop from there.
          - from: "26.6.6"
            to: "26.7.5"
            strategy: stop-start
            from_dist_url: "https://github.com/keelinfra/keycloak/releases/download/kc-26.6.6-keel1/keycloak-26.6.6.tar.gz"
          - from: "26.6.7"
            to: "26.7.5"
            strategy: stop-start
            from_dist_url: "https://github.com/keelinfra/keycloak/releases/download/kc-26.6.7-keel1/keycloak-26.6.7.tar.gz"
    steps:
      - uses: actions/checkout@v7

      - name: Install ansible
        run: |
          pipx install ansible-core
          ansible-galaxy collection install -r requirements.yml

      - name: Write single-node cluster definition (Keycloak ${{ matrix.from }})
        run: |
          cat > /tmp/ci-cluster.yml <<CFG
          ---
          cluster_name: keycloak-ci
          nodes:
            - host: 127.0.0.1
              name: ci-node1
              connection: local
          ssh_user: runner
          domain: sso.ci.local
          vip: ""
          keycloak_version: "${{ matrix.from }}"
          tls_mode: selfsigned
          CFG

      - name: Install Keycloak ${{ matrix.from }}
        env:
          FROM_DIST_URL: ${{ matrix.from_dist_url }}
        run: |
          ./configure -c /tmp/ci-cluster.yml
          ./install ${FROM_DIST_URL:+-e "keycloak_dist_url=$FROM_DIST_URL"}

      - name: Log in before the upgrade
        run: |
          refresh_token=$(curl -fsk --retry 10 --retry-delay 3 --retry-all-errors \
            --resolve sso.ci.local:443:127.0.0.1 \
            -d grant_type=password -d client_id=admin-cli \
            -d username=demo -d password=demo12345 \
            https://sso.ci.local/realms/demo/protocol/openid-connect/token \
            | jq -er .refresh_token)
          echo "::add-mask::$refresh_token"
          echo "REFRESH_TOKEN=$refresh_token" >> "$GITHUB_ENV"

      - name: Upgrade to ${{ matrix.to }}
        env:
          DIST_URL: ${{ matrix.dist_url }}
        run: ./upgrade --to "${{ matrix.to }}" ${DIST_URL:+--dist-url "$DIST_URL"}

      # The stop-start strategy has a documented short service window
      # (UPGRADES.md), and haproxy needs a couple of health-check rounds to
      # mark the backend UP again — so checks through the LB get a retry
      # budget. A cluster that is actually broken still fails after ~60s.
      - name: Assert the cluster runs ${{ matrix.to }}
        run: |
          target=$(readlink /opt/keycloak/current)
          echo "active version: $target"
          [[ "$(basename "$target")" == "keycloak-${{ matrix.to }}" ]]
          curl -fsk --retry 10 --retry-delay 3 --retry-all-errors \
            https://127.0.0.1:9000/health/ready
          curl -fsk --retry 20 --retry-delay 3 --retry-all-errors \
            --resolve sso.ci.local:443:127.0.0.1 \
            https://sso.ci.local/realms/demo/.well-known/openid-configuration \
            | jq -er .issuer

      - name: Pre-upgrade session must survive the upgrade
        run: |
          curl -fsk --retry 20 --retry-delay 3 --retry-all-errors \
            --resolve sso.ci.local:443:127.0.0.1 \
            -d grant_type=refresh_token -d client_id=admin-cli \
            -d refresh_token="$REFRESH_TOKEN" \
            https://sso.ci.local/realms/demo/protocol/openid-connect/token \
            | jq -er .access_token > /dev/null
          echo "✓ session created on ${{ matrix.from }} still refreshes on ${{ matrix.to }}"

      - name: Full session drill on the new version
        run: ./verify --drill session

      - name: Dump service logs on failure
        if: failure()
        run: |
          echo "=== keycloak status ==="
          sudo systemctl status keycloak --no-pager || true
          echo "=== keycloak journal ==="
          sudo journalctl -u keycloak --no-pager | tail -120 || true
          echo "=== patroni journal ==="
          sudo journalctl -u patroni --no-pager | tail -40 || true
          echo "=== haproxy journal ==="
          sudo journalctl -u haproxy --no-pager | tail -20 || true
          echo "=== listeners ==="
          sudo ss -tlnp || true
