---
name: upgrade matrix
# Executes every upgrade path listed in UPGRADES.md, end-to-end, on a clean
# single-node install: install the FROM version, log in, run ./upgrade, then
# prove the pre-upgrade session still refreshes on the TO version.
# This is the single-node run of each row in .github/upgrade-paths.yml; the
# 3-node run of the same rows is ha-matrix.yml, and UPGRADES.md records per
# row which of the two it has passed.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - playbooks/upgrade.yml
      - roles/keycloak/**
      - .github/upgrade-paths.yml
      - .github/scripts/upgrade_paths.py
      - .github/workflows/upgrade-matrix.yml

permissions:
  contents: read

jobs:
  paths:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.rows.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: rows
        # Every row in .github/upgrade-paths.yml, whatever the trigger.
        run: |
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet --break-system-packages pyyaml
          python3 .github/scripts/upgrade_paths.py | tee -a "$GITHUB_OUTPUT"

  upgrade:
    needs: paths
    name: "${{ matrix.from }} → ${{ matrix.to }} (${{ matrix.strategy }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.paths.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Install ansible
        run: |
          pipx install ansible-core
          ansible-galaxy collection install -r requirements.yml

      - name: Write single-node cluster definition (Keycloak ${{ matrix.from }})
        run: |
          cat > /tmp/ci-cluster.yml <<CFG
          ---
          cluster_name: keycloak-ci
          nodes:
            - host: 127.0.0.1
              name: ci-node1
              connection: local
          ssh_user: runner
          domain: sso.ci.local
          vip: ""
          keycloak_version: "${{ matrix.from }}"
          tls_mode: selfsigned
          CFG

      - name: Install Keycloak ${{ matrix.from }}
        env:
          FROM_DIST_URL: ${{ matrix.from_dist_url }}
        run: |
          ./configure -c /tmp/ci-cluster.yml
          ./install ${FROM_DIST_URL:+-e "keycloak_dist_url=$FROM_DIST_URL"}

      - name: Log in before the upgrade
        run: |
          refresh_token=$(curl -fsk --retry 10 --retry-delay 3 --retry-all-errors \
            --resolve sso.ci.local:443:127.0.0.1 \
            -d grant_type=password -d client_id=admin-cli \
            -d username=demo -d password=demo12345 \
            https://sso.ci.local/realms/demo/protocol/openid-connect/token \
            | jq -er .refresh_token)
          echo "::add-mask::$refresh_token"
          echo "REFRESH_TOKEN=$refresh_token" >> "$GITHUB_ENV"

      - name: Upgrade to ${{ matrix.to }}
        env:
          DIST_URL: ${{ matrix.dist_url }}
        run: ./upgrade --to "${{ matrix.to }}" ${DIST_URL:+--dist-url "$DIST_URL"}

      # The stop-start strategy has a documented short service window
      # (UPGRADES.md), and haproxy needs a couple of health-check rounds to
      # mark the backend UP again — so checks through the LB get a retry
      # budget. A cluster that is actually broken still fails after ~60s.
      - name: Assert the cluster runs ${{ matrix.to }}
        run: |
          target=$(readlink /opt/keycloak/current)
          echo "active version: $target"
          [[ "$(basename "$target")" == "keycloak-${{ matrix.to }}" ]]
          curl -fsk --retry 10 --retry-delay 3 --retry-all-errors \
            https://127.0.0.1:9000/health/ready
          curl -fsk --retry 20 --retry-delay 3 --retry-all-errors \
            --resolve sso.ci.local:443:127.0.0.1 \
            https://sso.ci.local/realms/demo/.well-known/openid-configuration \
            | jq -er .issuer

      - name: Pre-upgrade session must survive the upgrade
        run: |
          curl -fsk --retry 20 --retry-delay 3 --retry-all-errors \
            --resolve sso.ci.local:443:127.0.0.1 \
            -d grant_type=refresh_token -d client_id=admin-cli \
            -d refresh_token="$REFRESH_TOKEN" \
            https://sso.ci.local/realms/demo/protocol/openid-connect/token \
            | jq -er .access_token > /dev/null
          echo "✓ session created on ${{ matrix.from }} still refreshes on ${{ matrix.to }}"

      - name: Full session drill on the new version
        run: ./verify --drill session

      - name: Dump service logs on failure
        if: failure()
        run: |
          echo "=== keycloak status ==="
          sudo systemctl status keycloak --no-pager || true
          echo "=== keycloak journal ==="
          sudo journalctl -u keycloak --no-pager | tail -120 || true
          echo "=== patroni journal ==="
          sudo journalctl -u patroni --no-pager | tail -40 || true
          echo "=== haproxy journal ==="
          sudo journalctl -u haproxy --no-pager | tail -20 || true
          echo "=== listeners ==="
          sudo ss -tlnp || true
