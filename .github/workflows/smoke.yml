---
name: smoke
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Single-node install on the runner itself: proves every role deploys on a
  # clean Ubuntu 24.04 with real systemd, and that a login session survives a
  # restart. The 3-node variant runs in ha-smoke.yml on the container rig.
  single-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install ansible
        run: |
          pipx install ansible-core
          ansible-galaxy collection install -r requirements.yml

      - name: Write single-node cluster definition
        run: |
          cat > /tmp/ci-cluster.yml <<CFG
          ---
          cluster_name: keycloak-ci
          nodes:
            - host: 127.0.0.1
              name: ci-node1
              connection: local
          ssh_user: runner
          domain: sso.ci.local
          vip: ""
          keycloak_version: "26.8.1"
          tls_mode: selfsigned
          CFG

      - name: Configure
        run: ./configure -c /tmp/ci-cluster.yml

      - name: Install
        run: ./install

      - name: Health checks
        run: |
          curl -fsk https://127.0.0.1:9000/health/ready
          curl -fsk --resolve sso.ci.local:443:127.0.0.1 \
            https://sso.ci.local/realms/demo/.well-known/openid-configuration | grep -q issuer

      - name: Session survives restart
        run: ./verify --drill session

      - name: Restore drill
        run: ./verify --drill restore

      # 90 days: ./verify fails on any certificate within 30 days of expiry.
      # Switch the running node to tls_mode: custom, the path a team takes when
      # it moves from evaluation to its own certificate.
      - name: Switch to a custom certificate
        run: |
          mkdir -p /tmp/ci-tls && cd /tmp/ci-tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 90 -subj "/CN=CI custom CA" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign" \
            -keyout ca.key -out ca.crt
          openssl req -newkey rsa:2048 -nodes -subj "/CN=sso.ci.local" \
            -keyout server.key -out server.csr
          printf 'subjectAltName=DNS:sso.ci.local\n' > san.cnf
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial \
            -days 90 -extfile san.cnf -out server.crt
          cd "$GITHUB_WORKSPACE"
          sed -i 's/^tls_mode: selfsigned$/tls_mode: custom/' /tmp/ci-cluster.yml
          # relative to the cluster definition file
          printf 'tls_cert_file: ci-tls/server.crt\ntls_key_file: ci-tls/server.key\ntls_ca_file: ci-tls/ca.crt\n' \
            >> /tmp/ci-cluster.yml
          ./configure -c /tmp/ci-cluster.yml
          ./install
          # Keycloak re-reads certificate files hourly; restart to serve the new one now.
          sudo systemctl restart keycloak
          for _ in $(seq 60); do curl -fsk https://127.0.0.1:9000/health/ready && break; sleep 5; done
          # HAProxy marks the node up only after two passing checks 3 s apart;
          # wait for it to route again before the next step goes through it.
          for _ in $(seq 30); do
            curl -fsk --resolve sso.ci.local:443:127.0.0.1 -o /dev/null \
              https://sso.ci.local/realms/demo/.well-known/openid-configuration && break
            sleep 2
          done

      - name: Custom certificate is served and trusted
        run: |
          # --cacert trusts only the custom CA, so the old self-signed cert fails here
          curl -fsS --cacert /tmp/ci-tls/ca.crt --resolve sso.ci.local:443:127.0.0.1 \
            https://sso.ci.local/realms/demo/.well-known/openid-configuration | grep -q issuer
          # the nodes trust the custom CA system-wide
          curl -fsS --resolve sso.ci.local:443:127.0.0.1 \
            https://sso.ci.local/realms/demo/.well-known/openid-configuration | grep -q issuer
          ./verify

      - name: Dump service logs on failure
        if: failure()
        run: |
          echo "=== keycloak status ==="
          sudo systemctl status keycloak --no-pager || true
          echo "=== keycloak journal ==="
          sudo journalctl -u keycloak --no-pager | tail -120 || true
          echo "=== patroni journal ==="
          sudo journalctl -u patroni --no-pager | tail -40 || true
          echo "=== haproxy journal ==="
          sudo journalctl -u haproxy --no-pager | tail -20 || true
          echo "=== listeners ==="
          sudo ss -tlnp || true
