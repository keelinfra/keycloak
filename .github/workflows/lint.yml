---
name: lint
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install pre-commit
        run: pip install pre-commit
      # The hooks in .pre-commit-config.yaml: whitespace and file hygiene,
      # yamllint, shellcheck (every script with a shell shebang), ruff,
      # actionlint and ansible-lint (production profile).
      - name: pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
