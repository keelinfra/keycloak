---
name: unit
on:
  push:
    branches: [main]
    paths:
      - "tests/**"
      - "**.py"
      - .github/workflows/unit.yml
  pull_request:
    paths:
      - "tests/**"
      - "**.py"
      - .github/workflows/unit.yml

permissions:
  contents: read

jobs:
  # Unit tests of the Python scripts (tests/). 3.9 is what Rocky/Alma 9
  # nodes run playbooks/files/*.py and roles/*/files/*.py with.
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # What the scripts themselves import: PyYAML (.github/scripts) and
      # cryptography (cert-expiry.py). openssl and keytool come with the runner.
      - name: Install the scripts' dependencies
        run: python -m pip install pyyaml cryptography
      - name: Run the tests
        run: python -m unittest discover -s tests -v
