---
# Run before each commit:  pip install pre-commit && pre-commit install
# Run on everything:       pre-commit run --all-files
# CI (lint.yml) runs the same hooks, so a clean local run means a green lint job.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: detect-private-key

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  # Shell scripts are found by their shebang, so new scripts (with or
  # without .sh) are checked without editing a list.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  # Python: lint (ruff.toml) and format, like black
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
      - id: ruff-format

  # Also shellchecks each run: block when shellcheck is on PATH (it is in CI).
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # Last: the slowest. Installs the collections in requirements.yml itself.
  - repo: https://github.com/ansible/ansible-lint
    rev: v26.10.1
    hooks:
      - id: ansible-lint
        # the hook asks for python3.14; use whatever python3 is installed
        language_version: python3
